<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Неправильные глаголы</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
<style>
/* Палитра: Petal Rouge #E27396 · Pink Mist #EB9AB2 · Petal Frost #EFCFE3 · Beige #ECF2D8 · Light Blue #B3DEE2 */
:root{
  --bg:#ECF2D8; --card:#fffdf8; --ink:#4a2a38; --muted:#8a6a78; --line:#EFCFE3;
  --accent:#E27396; --accent-ink:#fff; --ok:#2f8f99; --ok-bg:#B3DEE2; --bad:#c94f77; --bad-bg:#EFCFE3;
  --warn:#EB9AB2; --chip:#EFCFE3;
  --AAA:#4fa9b1; --ABB:#E27396; --ABA:#93a85a; --ABC:#a46bb0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#251a21; --card:#33242e; --ink:#f7e9f0; --muted:#c9a9b8; --line:#4a3542;
    --accent:#EB9AB2; --accent-ink:#2a1820; --ok:#B3DEE2; --ok-bg:#1f3d41; --bad:#EB9AB2; --bad-bg:#4d2333;
    --warn:#E27396; --chip:#4a3542;
  }
}
:root[data-theme="dark"]{
  --bg:#251a21; --card:#33242e; --ink:#f7e9f0; --muted:#c9a9b8; --line:#4a3542;
  --accent:#EB9AB2; --accent-ink:#2a1820; --ok:#B3DEE2; --ok-bg:#1f3d41; --bad:#EB9AB2; --bad-bg:#4d2333;
  --warn:#E27396; --chip:#4a3542;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1,.q-ru,.forms,.big{font-family:"Abril Fatface",Georgia,serif;font-weight:400;letter-spacing:.01em}
h1{font-size:30px;margin:4px 0 12px;color:var(--accent)}
.btn.ok,.btn.bad{color:var(--accent-ink)}
.bar>i{background:linear-gradient(90deg,#B3DEE2,#EB9AB2,#E27396)!important}
button{font:inherit;cursor:pointer}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:14px}
.stat b{font-size:16px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;white-space:nowrap}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select,input[type=search]{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:var(--accent-ink)}
.btn.bad{background:var(--bad);color:var(--accent-ink)}
.speak{border:1px solid var(--line);background:var(--card);border-radius:99px;width:36px;height:36px;font-size:16px;line-height:1;color:var(--ink)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:99px;color:#fff;vertical-align:middle}
.b-AAA{background:var(--AAA)}.b-ABB{background:var(--ABB)}.b-ABA{background:var(--ABA)}.b-ABC{background:var(--ABC)}
/* table */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.f{font-weight:600}
.hid{color:transparent;background:var(--chip);border-radius:6px;cursor:pointer;user-select:none}
.hid::after{content:"•••";color:var(--muted)}
.hid.shown{color:inherit;background:none}
.hid.shown::after{content:""}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.s1,.dot.s2{background:var(--warn)}
.dot.s3{background:var(--AAA)}
.dot.s4,.dot.s5{background:var(--ok)}
.tblwrap{overflow-x:auto}
/* quiz */
.q-ru{font-size:26px;font-weight:700;text-align:center}
.q-en{font-size:22px;text-align:center;margin-top:6px;display:flex;gap:10px;justify-content:center;align-items:center}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;font:inherit;font-size:20px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.field input:focus{outline:none;border-color:var(--accent)}
.field input.good{border-color:var(--ok);background:var(--ok-bg)}
.field input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fix{font-size:14px;margin-top:4px;color:var(--ok);font-weight:600;min-height:20px}
.progress{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.opt{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:16px 8px;font-size:20px;font-weight:600}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.center{text-align:center}
.big{font-size:44px;font-weight:800}
/* flashcard */
.flip{perspective:1000px;cursor:pointer;margin-bottom:12px}
.flip-in{position:relative;min-height:230px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg)}
.forms{font-size:26px;font-weight:700}
.forms span{color:var(--muted);font-weight:400}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tip p{margin:6px 0}
.grp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px}
.grp div{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px}
.mist{margin:8px 0 0;padding-left:18px}
footer{margin:24px 0 8px;font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0}
@media (max-width:520px){
  .hide-sm{display:none}
  .q-ru{font-size:22px}
  th,td{padding:7px 4px;font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Неправильные глаголы 🇬🇧</h1>

  <div class="stats" id="stats"></div>
  <div class="bar"><i id="bar"></i></div>

  <div class="tabs" id="tabs">
    <button class="tab" data-tab="table">📋 Таблица</button>
    <button class="tab" data-tab="cards">🃏 Карточки</button>
    <button class="tab" data-tab="type">⌨️ Напиши</button>
    <button class="tab" data-tab="choice">✅ Выбери</button>
    <button class="tab" data-tab="speed">⚡ На время</button>
  </div>

  <div class="row">
    <select id="setSel" aria-label="Набор глаголов"></select>
    <select id="dirSel" aria-label="Что показывать">
      <option value="en">Подсказка: инфинитив (go)</option>
      <option value="ru">Подсказка: перевод (идти)</option>
    </select>
  </div>

  <main id="main"></main>

  <footer>
    <span>Прогресс сохраняется в этом браузере.</span>
    <button id="reset">Сбросить прогресс</button>
  </footer>
</div>

<script>
const RAW = `arise|arose|arisen|возникать
awake|awoke|awoken|просыпаться
be|was/were|been|быть
bear|bore|born/borne|рождать, выносить
beat|beat|beaten|бить
become|became|become|становиться
begin|began|begun|начинать
bend|bent|bent|гнуть, сгибать
bet|bet|bet|держать пари
bind|bound|bound|связывать
bite|bit|bitten|кусать
bleed|bled|bled|кровоточить
blow|blew|blown|дуть
break|broke|broken|ломать
breed|bred|bred|разводить
bring|brought|brought|приносить
build|built|built|строить
burn|burnt/burned|burnt/burned|гореть, жечь
buy|bought|bought|покупать
catch|caught|caught|ловить
choose|chose|chosen|выбирать
come|came|come|приходить
cost|cost|cost|стоить
creep|crept|crept|ползать
cut|cut|cut|резать
deal|dealt|dealt|иметь дело
dig|dug|dug|копать
do|did|done|делать
draw|drew|drawn|рисовать
dream|dreamt/dreamed|dreamt/dreamed|мечтать, видеть сны
drink|drank|drunk|пить
drive|drove|driven|водить машину
eat|ate|eaten|есть, кушать
fall|fell|fallen|падать
feed|fed|fed|кормить
feel|felt|felt|чувствовать
fight|fought|fought|драться, бороться
find|found|found|находить
fly|flew|flown|летать
forbid|forbade|forbidden|запрещать
forget|forgot|forgotten|забывать
forgive|forgave|forgiven|прощать
freeze|froze|frozen|замерзать
get|got|got|получать
give|gave|given|давать
go|went|gone|идти, ехать
grow|grew|grown|расти
hang|hung|hung|вешать, висеть
have|had|had|иметь
hear|heard|heard|слышать
hide|hid|hidden|прятать
hit|hit|hit|ударять
hold|held|held|держать
hurt|hurt|hurt|ранить, болеть
keep|kept|kept|хранить, держать
know|knew|known|знать
lay|laid|laid|класть, накрывать
lead|led|led|вести
learn|learnt/learned|learnt/learned|учить
leave|left|left|оставлять, уходить
lend|lent|lent|давать взаймы
let|let|let|позволять
lie|lay|lain|лежать
light|lit|lit|зажигать
lose|lost|lost|терять
make|made|made|делать, создавать
mean|meant|meant|значить
meet|met|met|встречать
pay|paid|paid|платить
put|put|put|класть, ставить
read|read|read|читать
ride|rode|ridden|ездить верхом
ring|rang|rung|звонить
rise|rose|risen|подниматься
run|ran|run|бежать
say|said|said|сказать
see|saw|seen|видеть
seek|sought|sought|искать
sell|sold|sold|продавать
send|sent|sent|посылать
set|set|set|устанавливать
shake|shook|shaken|трясти
shine|shone|shone|светить, сиять
shoot|shot|shot|стрелять
show|showed|shown|показывать
shut|shut|shut|закрывать
sing|sang|sung|петь
sink|sank|sunk|тонуть
sit|sat|sat|сидеть
sleep|slept|slept|спать
slide|slid|slid|скользить
smell|smelt/smelled|smelt/smelled|пахнуть, нюхать
speak|spoke|spoken|говорить
spell|spelt/spelled|spelt/spelled|писать по буквам
spend|spent|spent|тратить, проводить
spill|spilt/spilled|spilt/spilled|проливать
spread|spread|spread|распространять
stand|stood|stood|стоять
steal|stole|stolen|красть
stick|stuck|stuck|приклеивать
sting|stung|stung|жалить
strike|struck|struck|ударять, бастовать
swear|swore|sworn|клясться
sweep|swept|swept|подметать
swim|swam|swum|плавать
swing|swung|swung|качаться
take|took|taken|брать
teach|taught|taught|обучать
tear|tore|torn|рвать
tell|told|told|рассказывать
think|thought|thought|думать
throw|threw|thrown|бросать
understand|understood|understood|понимать
wake|woke|woken|будить, просыпаться
wear|wore|worn|носить (одежду)
weep|wept|wept|плакать
win|won|won|побеждать
write|wrote|written|писать`;

const first = s => s.split('/')[0];
function pattern(a,b,c){a=first(a);b=first(b);c=first(c);
  if(a===b&&b===c) return 'AAA'; if(b===c) return 'ABB'; if(a===c) return 'ABA'; return 'ABC';}
const VERBS = RAW.trim().split('\n').map(l=>{const [v1,v2,v3,ru]=l.split('|');return {id:v1,v1,v2,v3,ru,pat:pattern(v1,v2,v3)}});
const BYID = Object.fromEntries(VERBS.map(v=>[v.id,v]));
const rev = s => first(s).split('').reverse().join('');
// Порядок уроков: сначала простые группы, внутри — по похожим окончаниям (bought/brought/caught…)
const ORDER = [
  ...VERBS.filter(v=>v.pat==='AAA'),
  ...VERBS.filter(v=>v.pat==='ABA'),
  ...VERBS.filter(v=>v.pat==='ABB').sort((a,b)=>rev(a.v2).localeCompare(rev(b.v2))),
  ...VERBS.filter(v=>v.pat==='ABC').sort((a,b)=>rev(a.v3).localeCompare(rev(b.v3))),
];
const LESSONS = []; for(let i=0;i<ORDER.length;i+=10) LESSONS.push(ORDER.slice(i,i+10));
const PAT_INFO = {
  AAA:['Все три одинаковые','cut – cut – cut'],
  ABA:['1-я и 3-я совпадают','come – came – come'],
  ABB:['2-я и 3-я совпадают','buy – bought – bought'],
  ABC:['Все три разные','go – went – gone'],
};

/* ---------- хранение ---------- */
const KEY='irregular_verbs_v1';
function load(){try{const v=localStorage.getItem(KEY);if(v)return JSON.parse(v)}catch(e){}return null}
let S = Object.assign({box:{},err:{},streak:0,last:'',today:{d:'',n:0,ok:0},best:0,set:'L0',dir:'en',tab:'table'}, load()||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const dstr = off => new Date(Date.now()+off*864e5).toLocaleDateString('sv');
function touchDay(){const t=dstr(0);
  if(S.today.d!==t) S.today={d:t,n:0,ok:0};
  if(S.last!==t){S.streak = S.last===dstr(-1) ? S.streak+1 : 1; S.last=t;}
}
const LEARNED=4;
const box = id => S.box[id]||0;
function record(id,ok){
  S.box[id] = ok ? Math.min(5,box(id)+1) : 0;
  if(!ok) S.err[id]=(S.err[id]||0)+1;
  touchDay(); S.today.n++; if(ok) S.today.ok++;
  save(); renderStats();
}

/* ---------- утилиты ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const show = f => f.replace(/\//g,' / ');
function say(text){
  try{ if(!window.speechSynthesis) return;
    const u=new SpeechSynthesisUtterance(text.replace(/\//g,' or '));
    u.lang='en-GB'; u.rate=.8; speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
const sayAll = v => say(`${first(v.v1)}. ${v.v2}. ${v.v3}.`);
const norm = s => s.toLowerCase().replace(/[^a-z\/, ]/g,'').trim();
function correct(input, form){
  const parts = norm(input).split(/[\s\/,]+/).filter(Boolean);
  const vars = form.split('/');
  return parts.length>0 && parts.every(p=>vars.includes(p));
}
function regular(v){ // типичная ошибка: «goed», «runned»
  if(/e$/.test(v)) return v+'d';
  if(/[^aeiou]y$/.test(v)) return v.slice(0,-1)+'ied';
  return v+'ed';
}
// чем хуже знаем глагол, тем чаще он выпадает
function pick(list,n){
  let pool=list.map(v=>({v,w:Math.pow(6-box(v.id),2)})), out=[];
  while(out.length<n && pool.length){
    const tot=pool.reduce((s,x)=>s+x.w,0); let r=Math.random()*tot, i=0;
    while(r>pool[i].w){r-=pool[i].w;i++}
    out.push(pool[i].v); pool.splice(i,1);
  }
  return out;
}

/* ---------- наборы ---------- */
function setOptions(){
  const o=[['all',`Все глаголы (${VERBS.length})`]];
  LESSONS.forEach((l,i)=>o.push(['L'+i,`Урок ${i+1}: ${l.slice(0,3).map(v=>v.v1).join(', ')}…`]));
  Object.entries(PAT_INFO).forEach(([k,[t,e]])=>o.push([k,`Группа ${k}: ${e}`]));
  o.push(['hard','Ещё не выученные'],['err','Мои ошибки']);
  $('#setSel').innerHTML=o.map(([k,t])=>`<option value="${k}">${esc(t)}</option>`).join('');
  $('#setSel').value=S.set;
  if($('#setSel').value!==S.set){S.set='all';$('#setSel').value='all'}
}
function currentSet(){
  const s=S.set;
  if(s==='all') return ORDER;
  if(s[0]==='L') return LESSONS[+s.slice(1)]||ORDER;
  if(PAT_INFO[s]) return ORDER.filter(v=>v.pat===s);
  if(s==='hard') return ORDER.filter(v=>box(v.id)<LEARNED);
  if(s==='err') return ORDER.filter(v=>S.err[v.id] && box(v.id)<LEARNED);
  return ORDER;
}
function emptyMsg(){
  return `<div class="card center"><div class="big">🎉</div><p>В этом наборе пусто — всё выучено или ошибок нет.<br>Выбери другой набор сверху.</p></div>`;
}

/* ---------- шапка ---------- */
function renderStats(){
  const learned=VERBS.filter(v=>box(v.id)>=LEARNED).length;
  const t = S.today.d===dstr(0) ? S.today : {n:0,ok:0};
  const streak = (S.last===dstr(0)||S.last===dstr(-1)) ? S.streak : 0;
  $('#stats').innerHTML=`
    <div class="stat">⭐ Выучено <b>${learned}</b> из ${VERBS.length}</div>
    <div class="stat">🔥 Дней подряд <b>${streak}</b></div>
    <div class="stat">📅 Сегодня <b>${t.ok}</b> / ${t.n}</div>
    ${S.best?`<div class="stat">⚡ Рекорд <b>${S.best}</b></div>`:''}`;
  $('#bar').style.width=(learned/VERBS.length*100)+'%';
}

/* ---------- таблица ---------- */
let hideForms=false, hideRu=false, query='';
function renderTable(){
  const list=currentSet();
  const pats = new Set(list.map(v=>v.pat));
  const tip = `<div class="card tip">
    <p><b>Как учить:</b> не подряд по алфавиту, а группами — так в голове складываются шаблоны.
    Уроки уже собраны по группам и похожим окончаниям (bought, brought, caught, taught…).</p>
    <div class="grp">${Object.entries(PAT_INFO).map(([k,[t,e]])=>`<div><span class="badge b-${k}">${k}</span> ${t}<br><span class="muted">${e}</span></div>`).join('')}</div>
    <p class="small muted">Закрой формы кнопкой ниже и проверяй себя: нажми на ••• чтобы подсмотреть. Цвет точки — насколько глагол выучен.</p>
  </div>`;
  const q=norm(query);
  const rows=list.filter(v=>!q||[v.v1,v.v2,v.v3,v.ru].join(' ').toLowerCase().includes(q)).map(v=>{
    const h=c=>c?'hid':'';
    return `<tr>
      <td><span class="dot s${box(v.id)}" title="уровень ${box(v.id)}"></span></td>
      <td class="f">${esc(v.v1)}</td>
      <td class="f ${h(hideForms)}">${esc(show(v.v2))}</td>
      <td class="f ${h(hideForms)}">${esc(show(v.v3))}</td>
      <td class="${h(hideRu)}">${esc(v.ru)}</td>
      <td class="hide-sm"><span class="badge b-${v.pat}">${v.pat}</span></td>
      <td><button class="speak" data-say="${esc(v.id)}" aria-label="Послушать">🔊</button></td>
    </tr>`}).join('');
  $('#main').innerHTML = tip + `<div class="card">
    <div class="row">
      <input type="search" id="q" placeholder="Поиск…" value="${esc(query)}">
      <button class="btn ghost" id="tForms">${hideForms?'Показать':'Закрыть'} 2-ю и 3-ю формы</button>
      <button class="btn ghost" id="tRu">${hideRu?'Показать':'Закрыть'} перевод</button>
    </div>
    <div class="tblwrap"><table>
      <thead><tr><th></th><th>V1</th><th>V2 · Past</th><th>V3 · Participle</th><th>Перевод</th><th class="hide-sm"></th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="7" class="muted">Ничего не найдено</td></tr>'}</tbody>
    </table></div></div>`;
  $('#q').oninput=e=>{query=e.target.value;const p=e.target.selectionStart;renderTable();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  $('#tForms').onclick=()=>{hideForms=!hideForms;renderTable()};
  $('#tRu').onclick=()=>{hideRu=!hideRu;renderTable()};
  $('#main').querySelectorAll('.hid').forEach(td=>td.onclick=()=>td.classList.toggle('shown'));
  $('#main').querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>sayAll(BYID[b.dataset.say]));
}

/* ---------- карточки ---------- */
let cardV=null, cardSeen=0;
function renderCards(){
  const list=currentSet(); if(!list.length){$('#main').innerHTML=emptyMsg();return}
  let next=pick(list,Math.min(2,list.length)); cardV = next[0]===cardV && next[1] ? next[1] : next[0];
  const v=cardV, front = S.dir==='ru' ? `<div class="q-ru">${esc(v.ru)}</div>` : `<div class="q-ru">${esc(v.v1)}</div><div class="muted">${esc(v.ru)}</div>`;
  $('#main').innerHTML=`
    <div class="flip" id="flip"><div class="flip-in">
      <div class="face">${front}<div class="muted small">Назови три формы вслух, потом нажми на карточку</div></div>
      <div class="face back">
        <div class="forms">${esc(v.v1)} <span>–</span> ${esc(show(v.v2))} <span>–</span> ${esc(show(v.v3))}</div>
        <div class="muted">${esc(v.ru)}</div>
        <div><span class="badge b-${v.pat}">${v.pat}</span> <span class="small muted">${PAT_INFO[v.pat][0]}</span></div>
      </div>
    </div></div>
    <div class="row" id="cardBtns" style="justify-content:center;visibility:hidden">
      <button class="btn bad" id="no">😕 Ещё учу</button>
      <button class="speak" id="sp" aria-label="Послушать">🔊</button>
      <button class="btn ok" id="yes">😎 Знаю</button>
    </div>
    <p class="center small muted">Просмотрено карточек: ${cardSeen}</p>`;
  $('#flip').onclick=()=>{$('#flip').classList.add('on');$('#cardBtns').style.visibility='visible';sayAll(v)};
  $('#sp').onclick=()=>sayAll(v);
  $('#yes').onclick=()=>{record(v.id,true);cardSeen++;renderCards()};
  $('#no').onclick=()=>{record(v.id,false);cardSeen++;renderCards()};
}

/* ---------- раунд (общий для «Напиши» и «Выбери») ---------- */
let R=null;
function newRound(kind){
  const list=currentSet();
  R={kind,queue:pick(list,Math.min(10,list.length)),total:0,firstTry:0,missed:new Set(),i:0};
  R.total=R.queue.length;
}
function endRound(){
  const m=[...R.missed].map(id=>BYID[id]);
  const pct=R.total?R.firstTry/R.total:0;
  const face = pct===1?'🏆':pct>=.8?'🎉':pct>=.5?'👍':'💪';
  $('#main').innerHTML=`<div class="card center">
    <div class="big">${face}</div>
    <p style="font-size:20px">С первой попытки: <b>${R.firstTry}</b> из ${R.total}</p>
    ${m.length?`<div style="text-align:left;display:inline-block"><b>Повтори эти:</b><ul class="mist">${m.map(v=>`<li><b>${esc(v.v1)} – ${esc(show(v.v2))} – ${esc(show(v.v3))}</b> <span class="muted">${esc(v.ru)}</span></li>`).join('')}</ul></div>`:'<p>Без единой ошибки!</p>'}
    <p><button class="btn" id="again">Ещё раунд</button></p></div>`;
  $('#again').onclick=()=>{R=null;render()};
  $('#again').focus();
}
function afterAnswer(v,ok){
  if(!R.missed.has(v.id)) record(v.id,ok);
  if(ok){ if(!R.missed.has(v.id)) R.firstTry++; R.queue.shift(); }
  else { R.missed.add(v.id); const q=R.queue.shift(); R.queue.splice(Math.min(3,R.queue.length),0,q); }
}
const progressLine = () => `<div class="progress"><span>Осталось: ${R.queue.length}</span><span>Верно с первого раза: ${R.firstTry}</span></div>`;

/* ---------- «Напиши» ---------- */
function renderType(){
  if(!currentSet().length){$('#main').innerHTML=emptyMsg();return}
  if(!R||R.kind!=='type') newRound('type');
  if(!R.queue.length) return endRound();
  const v=R.queue[0], askV1=S.dir==='ru';
  const fields=[...(askV1?[['v1','V1 · инфинитив']]:[]),['v2','V2 · Past Simple'],['v3','V3 · Past Participle']];
  $('#main').innerHTML=`<div class="card" id="qc">
    ${progressLine()}
    <div class="q-ru">${esc(v.ru)}</div>
    ${askV1?'':`<div class="q-en">${esc(v.v1)} <button class="speak" id="sp" aria-label="Послушать">🔊</button></div>`}
    <div class="fields">${fields.map(([k,l])=>`<div class="field"><label for="f_${k}">${l}</label>
      <input id="f_${k}" data-k="${k}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next"><div class="fix" id="x_${k}"></div></div>`).join('')}</div>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="hint">Подсказка</button>
      <button class="btn" id="go">Проверить</button>
    </div>
    <p class="small muted" id="hintTxt"></p>
  </div>`;
  const inputs=[...$('#main').querySelectorAll('.field input')];
  inputs[0].focus();
  if($('#sp')) $('#sp').onclick=()=>say(v.v1);
  let done=false, hinted=false;
  $('#hint').onclick=()=>{hinted=true;$('#hintTxt').textContent=`Группа ${v.pat}: ${PAT_INFO[v.pat][0].toLowerCase()} (как ${PAT_INFO[v.pat][1]}). Первые буквы: ${fields.map(([k])=>first(v[k]).slice(0,2)+'…').join(', ')}`};
  const check=()=>{
    if(done){afterAnswer(v,ok);return renderType()}
    if(inputs.some(i=>!i.value.trim())){const e=inputs.find(i=>!i.value.trim());e.focus();$('#qc').classList.remove('shake');void $('#qc').offsetWidth;$('#qc').classList.add('shake');return}
    done=true;
    ok=inputs.map(i=>{const g=correct(i.value,v[i.dataset.k]);i.classList.add(g?'good':'wrong');i.readOnly=true;
      $('#x_'+i.dataset.k).textContent=g?'✓':show(v[i.dataset.k]);return g}).every(Boolean);
    sayAll(v);
    $('#go').textContent= ok?'Дальше →':'Понятно, дальше →';
    $('#go').className='btn '+(ok?'ok':'bad');
    $('#hint').style.visibility='hidden';
    setTimeout(()=>$('#go').focus(),0);
  };
  let ok=false;
  inputs.forEach((inp,idx)=>inp.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return; e.preventDefault();
    if(!done && idx<inputs.length-1 && !inputs[idx+1].value.trim()) inputs[idx+1].focus(); else check();
  }));
  $('#go').onclick=check;
}

/* ---------- «Выбери» и «На время» ---------- */
function makeChoice(v){
  const k = Math.random()<.5?'v2':'v3';
  const ans=v[k], vars=ans.split('/');
  const clash = d => d.split('/').some(x=>vars.includes(x));
  const cand=[regular(first(v.v1)), first(k==='v2'?v.v3:v.v2), first(v.v1), ...shuffle(VERBS).slice(0,12).map(o=>first(o[k]))];
  const opts=[ans];
  for(const d of cand){ if(opts.length>=4) break; if(!clash(d) && !opts.some(o=>o.split('/').includes(d))) opts.push(d); }
  return {v,k,ans,opts:shuffle(opts)};
}
function choiceHTML(c){
  const label = c.k==='v2' ? 'Past Simple (V2)' : 'Past Participle (V3)';
  const prompt = S.dir==='ru' ? `<div class="q-ru">${esc(c.v.ru)}</div>` : `<div class="q-ru">${esc(c.v.v1)}</div><div class="center muted">${esc(c.v.ru)}</div>`;
  return `${prompt}<p class="center">Выбери <b>${label}</b></p>
    <div class="opts">${c.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(show(o))}</button>`).join('')}</div>`;
}
function bindChoice(c,onDone,delay){
  const btns=[...$('#main').querySelectorAll('.opt')];
  let locked=false;
  const choose=i=>{ if(locked) return; locked=true;
    const ok=c.opts[i]===c.ans;
    btns[i].classList.add(ok?'good':'wrong');
    btns[c.opts.indexOf(c.ans)].classList.add('good');
    if(!ok) say(`${first(c.v.v1)}. ${c.v.v2}. ${c.v.v3}.`);
    setTimeout(()=>onDone(ok), ok?delay[0]:delay[1]);
  };
  btns.forEach((b,i)=>b.onclick=()=>choose(i));
  document.onkeydown=e=>{const n=+e.key; if(n>=1&&n<=btns.length) choose(n-1)};
}
function renderChoice(){
  if(!currentSet().length){$('#main').innerHTML=emptyMsg();return}
  if(!R||R.kind!=='choice') newRound('choice');
  if(!R.queue.length) return endRound();
  const c=makeChoice(R.queue[0]);
  $('#main').innerHTML=`<div class="card">${progressLine()}${choiceHTML(c)}<p class="small muted center">Можно нажимать цифры 1–4</p></div>`;
  bindChoice(c, ok=>{afterAnswer(c.v,ok);renderChoice()}, [600,1800]);
}

let SP=null, spTimer=null;
function renderSpeed(){
  clearInterval(spTimer);
  const list=currentSet(); if(!list.length){$('#main').innerHTML=emptyMsg();return}
  if(!SP){
    $('#main').innerHTML=`<div class="card center">
      <div class="big">⚡</div>
      <p style="font-size:18px">60 секунд. Сколько форм успеешь угадать?</p>
      <p class="muted">Рекорд: <b>${S.best||0}</b></p>
      <button class="btn" id="start">Старт!</button></div>`;
    $('#start').onclick=()=>{SP={score:0,wrong:0,end:Date.now()+60000};speedQ()};
    $('#start').focus();
    return;
  }
}
function speedQ(){
  const list=currentSet();
  const left=Math.max(0,Math.ceil((SP.end-Date.now())/1000));
  if(left<=0) return speedEnd();
  const c=makeChoice(pick(list,1)[0]);
  $('#main').innerHTML=`<div class="card"><div class="progress"><span id="tm">⏱ ${left} c</span><span>Очки: <b>${SP.score}</b></span></div>${choiceHTML(c)}</div>`;
  clearInterval(spTimer);
  spTimer=setInterval(()=>{const l=Math.ceil((SP.end-Date.now())/1000); if(l<=0){clearInterval(spTimer);speedEnd()} else if($('#tm')) $('#tm').textContent=`⏱ ${l} c`},250);
  bindChoice(c, ok=>{ if(!SP) return; record(c.v.id,ok); ok?SP.score++:SP.wrong++; speedQ(); }, [250,1200]);
}
function speedEnd(){
  if(!SP) return;
  clearInterval(spTimer); document.onkeydown=null;
  const rec = SP.score>(S.best||0); if(rec){S.best=SP.score;save();renderStats()}
  $('#main').innerHTML=`<div class="card center"><div class="big">${rec?'🏆':'⏱'}</div>
    <p style="font-size:20px">Очки: <b>${SP.score}</b>, ошибок: ${SP.wrong}</p>
    <p>${rec?'Новый рекорд!':'Рекорд: '+S.best}</p>
    <button class="btn" id="start">Ещё раз</button></div>`;
  SP=null;
  $('#start').onclick=()=>{SP={score:0,wrong:0,end:Date.now()+60000};speedQ()};
  $('#start').focus();
}

/* ---------- навигация ---------- */
function render(){
  document.onkeydown=null; clearInterval(spTimer); if(S.tab!=='speed') SP=null;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  ({table:renderTable,cards:renderCards,type:renderType,choice:renderChoice,speed:renderSpeed})[S.tab]();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;R=null;SP=null;save();render()});
$('#setSel').onchange=e=>{S.set=e.target.value;R=null;SP=null;save();render()};
$('#dirSel').onchange=e=>{S.dir=e.target.value;R=null;save();render()};
$('#reset').onclick=()=>{ if(confirm('Стереть весь прогресс?')){ S={box:{},err:{},streak:0,last:'',today:{d:'',n:0,ok:0},best:0,set:S.set,dir:S.dir,tab:S.tab}; save(); R=null; renderStats(); render(); } };

setOptions(); $('#dirSel').value=S.dir; renderStats(); render();
</script>
</body>
