<style>
:root{
  --bg:#070b1c; --panel:#111a36; --panel2:#182449; --line:#2a3a6b;
  --text:#eaf0ff; --mute:#9fb0d8; --accent:#ff9a4d; --accent2:#ffc46b;
  --ok:#47d18c; --bad:#ff6b6b; --info:#6fb6ff; --card:#fff7e6; --cardtext:#2a2114;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;
  background-image:
    radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 9%,#fff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 34% 62%,#cfe0ff 50%,transparent 51%),
    radial-gradient(1px 1px at 91% 44%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 58% 83%,#fff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 6% 77%,#ffe2b8 50%,transparent 51%),
    radial-gradient(600px 400px at 110% -10%,rgba(232,137,74,.28),transparent 70%),
    radial-gradient(500px 400px at -10% 110%,rgba(72,96,220,.25),transparent 70%);
  background-attachment:fixed;
}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:clamp(26px,6vw,40px);line-height:1.1;margin:8px 0 6px;letter-spacing:-.5px}
h2{font-size:20px;margin:0 0 8px}
h3{font-size:13px;margin:0 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;font-weight:700}
p{margin:0 0 10px}
.sub{color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.hud{position:sticky;top:0;z-index:5;background:rgba(7,11,28,.92);backdrop-filter:blur(6px);
  margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hud .lvl{font-weight:700;flex:1 1 150px;min-width:0}
.hud .lvl small{display:block;color:var(--mute);font-weight:400}
.meter{flex:1 1 150px}
.meter .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.bar{height:10px;background:#0b1230;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.air{font-size:13px;color:var(--mute);white-space:nowrap}
.air b{color:var(--text);font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);
  background:var(--panel2);padding:12px 14px;min-height:46px;text-align:left}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#1d1206;font-weight:700;text-align:center}
button.primary:hover{background:var(--accent2)}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>button{flex:1 1 200px}
.speaker{display:flex;gap:12px;align-items:flex-start}
.ava{width:56px;height:56px;flex:none;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:#000}
.ava svg,.ava img{width:100%;height:100%;display:block;object-fit:cover}
.ava.sm{width:38px;height:38px}
.bubble{background:var(--panel2);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 14px;flex:1;min-width:0}
.bubble .who{font-weight:700}
.bubble .role{font-size:12px;color:var(--mute);margin-bottom:6px}
.bubble .say{font-size:17px}
.note{border-radius:12px;padding:10px 12px;margin-top:12px;border:1px solid}
.note.ok{background:rgba(71,209,140,.12);border-color:var(--ok)}
.note.bad{background:rgba(255,107,107,.12);border-color:var(--bad)}
.note.info{background:rgba(111,182,255,.1);border-color:var(--info)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:var(--card);color:var(--cardtext);border:2px solid transparent;border-radius:12px;padding:10px 12px;
  text-align:left;min-height:0;display:block;width:100%;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.card b{display:block;font-size:15px;line-height:1.25;margin-bottom:4px}
.card span{font-size:13px;line-height:1.35;display:block}
.card em{font-style:normal;font-size:11px;color:#8a6a34;display:block;margin-top:6px;text-transform:uppercase;letter-spacing:.5px}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,154,77,.35)}
.card.new{animation:pop .5s}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.asks{display:grid;gap:8px}
.asks button{display:flex;gap:10px;align-items:center}
.asks .cost{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.chip.done{border-color:var(--ok);color:var(--ok)}
.chip.fake{border-color:var(--bad);color:var(--bad)}
.chip.cur{border-color:var(--accent);color:var(--accent2)}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cast div{display:flex;gap:10px;align-items:center;font-size:14px}
.cast small{display:block;color:var(--mute)}
canvas{width:100%;height:170px;display:block;background:#050a1d;border:1px solid var(--line);border-radius:12px}
input[type=range]{width:100%;accent-color:var(--accent);height:34px}
.freq{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.big{font-size:44px;font-weight:800;line-height:1}
.rank{font-size:22px;font-weight:800;color:var(--accent2)}
.stamp{display:inline-block;border:2px solid var(--ok);color:var(--ok);border-radius:8px;padding:2px 8px;font-weight:800;
  transform:rotate(-3deg);font-size:13px;letter-spacing:1px;margin-bottom:6px}
a{color:var(--info)}
footer{margin-top:24px;font-size:13px;color:var(--mute)}
@media (max-width:520px){.bubble .say{font-size:16px}.ava{width:46px;height:46px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ===== Настройки автора =====
   AUTHOR — имя автора игры (появится внизу страницы).
   ART — свои рисунки героев: положи картинки рядом с игрой и укажи пути,
   например ART = { zoya: 'kosmiks-art/zoya.png', avrora: 'kosmiks-art/sova.png' } */
const AUTHOR = '';
const ART = {};

/* ===== Герои рассказа ===== */
const CH = {
  zoya:  {n:'Зоя Волкова', r:'13 лет, мечтает стать журналисткой', bg:'#3b6cff', hair:'#5a3421', st:'tails'},
  mom:   {n:'Наталья Волкова', r:'мама Зои, руководитель миссии «Минерва»', bg:'#0f8f7e', hair:'#2b2b33', st:'bun'},
  avrora:{n:'Аврора', r:'искусственный интеллект ЦУПа', bg:'#6b3fd4', owl:true},
  viktor:{n:'Виктор', r:'канал «Привет с орбиты», бывший космонавт', bg:'#1f4fa3', hair:'#3a2a1c', st:'short'},
  nika:  {n:'Ника', r:'канал «Наука за минуту», историк', bg:'#c0392b', hair:'#8a4b1f', st:'long'},
  alex:  {n:'Алексей', r:'канал «Мрачный космос»', bg:'#3a3f4b', hair:'#16161a', st:'short'},
  evg:   {n:'Евгения', r:'канал «Спросите астрофизика»', bg:'#a86b2d', hair:'#b9bcc4', st:'bun'},
  alisa: {n:'Алиса Дозорова', r:'канал «Научный дозор», кумир Зои', bg:'#2f9bd8', hair:'#e2531d', st:'bob'}
};

function ava(id, cls){
  const c = CH[id];
  let inner;
  if (ART[id]) inner = `<img src="${ART[id]}" alt="">`;
  else if (c.owl) inner = `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="${c.bg}"/>
    <path d="M14 20 L20 8 L27 18 M50 20 L44 8 L37 18" fill="#d9c7ff"/>
    <ellipse cx="32" cy="38" rx="20" ry="22" fill="#efe6ff"/>
    <circle cx="23" cy="30" r="9" fill="#fff"/><circle cx="41" cy="30" r="9" fill="#fff"/>
    <circle cx="23" cy="30" r="4.5" fill="#2a1a5e"/><circle cx="41" cy="30" r="4.5" fill="#2a1a5e"/>
    <circle cx="24.5" cy="28.5" r="1.5" fill="#fff"/><circle cx="42.5" cy="28.5" r="1.5" fill="#fff"/>
    <path d="M32 34 L27.5 41 L36.5 41Z" fill="#ffb347"/>
    <path d="M22 50 q5 5 10 0 q5 5 10 0" stroke="#b9a2f0" stroke-width="2" fill="none"/></svg>`;
  else {
    const h = c.hair, skin = '#f6d3b8';
    const back = {
      long:`<path d="M12 30 Q12 8 32 8 Q52 8 52 30 L52 60 L12 60Z" fill="${h}"/>`,
      bob:`<path d="M11 30 Q11 8 32 8 Q53 8 53 30 L53 46 L11 46Z" fill="${h}"/>`,
      tails:`<circle cx="10" cy="36" r="8" fill="${h}"/><circle cx="54" cy="36" r="8" fill="${h}"/>`,
      bun:`<circle cx="32" cy="9" r="8" fill="${h}"/>`,
      short:''
    }[c.st];
    inner = `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="${c.bg}"/>
      ${back}
      <path d="M14 64 Q14 50 32 50 Q50 50 50 64Z" fill="#fff" opacity=".9"/>
      <circle cx="32" cy="33" r="17" fill="${skin}"/>
      <path d="M14 31 Q14 12 32 12 Q50 12 50 31 Q44 20 32 20 Q20 20 14 31Z" fill="${h}"/>
      <circle cx="25.5" cy="34" r="2.2" fill="#2a2114"/><circle cx="38.5" cy="34" r="2.2" fill="#2a2114"/>
      <path d="M26 41 Q32 46 38 41" stroke="#a5553f" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
  }
  return `<div class="ava ${cls||''}">${inner}</div>`;
}
function say(id, text){
  const c = CH[id];
  return `<div class="speaker">${ava(id)}<div class="bubble"><div class="who">${c.n}</div><div class="role">${c.r}</div><div class="say">${text}</div></div></div>`;
}

/* ===== Факты (карточки блокнота) ===== */
const FACTS = {
  freq:{t:'Частота сигнала — 2,4 МГц', d:'Для связи с дальним космосом нужны частоты от 2110 МГц. Сигнал на 2,4 МГц затух бы задолго до Земли. Значит, он родился где-то рядом с нами.', s:'Приёмник ЦУПа'},
  wow:{t:'Чем оказался сигнал «WOW»', d:'В 1977 году его приняли за послание инопланетян. Потом выяснилось: это природный космический лазер — излучение нейтронной звезды прошло сквозь облако водорода.', s:'Аврора'},
  sun:{t:'Календарь солнечной засветки', d:'Солнце «слепит» антенны только два раза в год. Осенняя засветка закончилась 28 сентября, а сейчас октябрь. И засветка лишь портит связь — новых сигналов она не создаёт.', s:'Аврора'},
  mercury:{t:'Почему «гуляет» орбита Меркурия', d:'Масса Солнца искривляет пространство-время — это доказал Эйнштейн. Планету Вулкан, которой объясняли отклонение, перестали искать сто лет назад.', s:'Ролик «Науки за минуту»'},
  io:{t:'Что известно про Ио', d:'Луна Юпитера с сотнями вулканов и равнинами из серы. Её греет приливная сила Юпитера. Следов жизни зонды там не находили.', s:'Аврора'},
  juni:{t:'Спутники связи JuniX', d:'Все группировки вышли на расчётные орбиты и работают штатно. Кадр от Юпитера идёт до Земли около часа.', s:'Аврора'},
  one:{t:'Сигнал слышит одна антенна', d:'Его ловит только антенна Восточного центра дальней космической связи в Приморье. Спутники JuniX его не передавали — он пришёл в обход них.', s:'Проверка антенн'},
  weather:{t:'Погода в селе Галенки', d:'Рядом с антенной стоит редкий для осени спокойный безоблачный вечер. Ни грозы, ни шторма.', s:'Прогноз погоды'},
  all:{t:'«Идёт со всех сторон»', d:'Операторы в зале удивляются: у сигнала нет направления, будто источник совсем рядом с антенной. Длится он всего пару секунд.', s:'Операторы ЦУПа'},
  peryton:{t:'История «перетонов»', d:'В конце 90-х австралийские учёные ловили «загадочные сигналы из космоса». Оказалось, их создавала микроволновка, которую открывали рядом с антенной.', s:'Ника'},
  night:{t:'На антенне ночная смена', d:'В Приморье уже поздний вечер. Сотрудники дежурят у антенны всю ночь и ужинают прямо на станции.', s:'Аврора'}
};

/* ===== Уровни ===== */
const LEVELS = [
 { name:'Первый сигнал', air:3,
   brief:[
     ['mom','Добро пожаловать в сердце ЦУПа! Жёлтые треугольники на экране — зонды OrbiX, красные — спутники связи JuniX у Юпитера.'],
     ['avrora','ВНИМАНИЕ! ПОЛУЧЕН НЕОПОЗНАННЫЙ СИГНАЛ! Он затух раньше, чем я распознала источник. Известно одно: он пришёл во время сеанса связи с группировкой у Ио.'],
     ['zoya','Блогеры уже достают телефоны. Сначала мне нужен хоть один твёрдый факт. Аврора, дай мне приёмник!']
   ],
   mini:'tuner',
   asks:[
     {f:'wow', who:'avrora', q:'Аврора, что такое сигнал «WOW»?'},
     {f:'sun', who:'avrora', q:'Аврора, когда Солнце мешает антеннам?'},
     {f:'mercury', who:'nika', q:'Вспомнить ролик Ники про орбиту Меркурия'},
     {f:'io', who:'avrora', q:'Аврора, расскажи про Ио'},
     {f:'juni', who:'avrora', q:'Аврора, как работают спутники JuniX?'}
   ],
   versions:[
     {who:'viktor', tag:'Новый «WOW»', text:'Ребята, что тут творится! Это же новый сигнал «WOW» — послание внеземной цивилизации!',
      ans:['wow','freq'], ok:'Даже знаменитый «WOW» оказался природным явлением. Необычный сигнал — ещё не послание.'},
     {who:'alisa', tag:'Жизнь на Ио', text:'Сигнал пришёл с Ио. Тепло, вулканы, лава прячет следы — идеальное место для цивилизации, которая скрывается от нас.',
      ans:['freq'], ok:'Сигнал на 2,4 МГц просто не долетел бы от Юпитера. Источник где-то у Земли — Ио ни при чём.'},
     {who:'viktor', tag:'Засветка Солнцем', text:'Я всё понял! Это солнечная интерференция: Солнце встало на одну линию со спутником и засветило антенну!',
      ans:['sun'], ok:'Засветка закончилась ещё 28 сентября. И она только ухудшает связь, а не рождает новые всплески.'},
     {who:'alisa', tag:'Планета Вулкан', text:'Вулкан! Планета, спрятанная в солнечной короне. Её искал сам Леверье. Может, этот сигнал доказывает, что она существует?',
      ans:['mercury'], ok:'Вулкан придумали, чтобы объяснить орбиту Меркурия. Эйнштейн объяснил её без лишней планеты.'},
     {who:'alex', tag:'Нибиру', text:'«Московский ЦУП поймал сигнал с Нибиру? Планета апокалипсиса, которая прячется за Солнцем, действительно существует?!»',
      ans:['occam'], ok:'У этой версии нет ни одной улики — только жуткая музыка. Не плодим сущностей без надобности.'}
   ]
 },
 { name:'Второй сигнал', air:3,
   brief:[
     ['avrora','ПОЛУЧЕН НОВЫЙ НЕОПОЗНАННЫЙ СИГНАЛ! Снова 2,4 МГц, снова без видимого источника.'],
     ['zoya','Он повторился! Значит, это не случайность. Надо понять, кто именно его слышит.']
   ],
   mini:'antennas',
   asks:[
     {f:'weather', who:'avrora', q:'Аврора, какая погода у антенны?'},
     {f:'peryton', who:'nika', q:'Спросить Нику, что она знает о «перетонах»'},
     {f:'all', who:'mom', q:'Послушать, что говорят операторы в зале'},
     {f:'night', who:'avrora', q:'Аврора, кто сейчас работает на антенне?'}
   ],
   versions:[
     {who:'evg', tag:'Гроза', text:'Ну вот, а я что говорила? Это атмосферное явление. Не удивлюсь, если над антенной сейчас гремит гроза или шторм.',
      ans:['weather'], ok:'Версия была разумной и простой — такую стоило проверить первой. Но над Галенками ясное небо.'},
     {who:'alisa', tag:'«Перетоны»', text:'Всё ясно. Это «перетоны» — загадочные космические частицы! Мы наконец-то докажем, что они существуют!',
      ans:['peryton'], ok:'«Перетоны» разоблачили 30 лет назад. Зато в этой истории есть очень интересная подсказка…'},
     {who:'alisa', tag:'«От нас скрывают»', text:'Помехи? Так я и поверила! Это сигналы инопланетян, а руководство ЦУПа всё скрывает!',
      ans:['occam'], ok:'Когда фактов нет, остаётся «от нас скрывают». Это уже не расследование, а фантазия.'}
   ]
 }
];

const SUSPECTS = [
  {id:'io', t:'Цивилизация на Ио'},
  {id:'vulcan', t:'Планета Вулкан'},
  {id:'sun', t:'Солнечная засветка'},
  {id:'storm', t:'Гроза над антенной'},
  {id:'peryton', t:'Космические частицы «перетоны»'},
  {id:'micro', t:'Микроволновка на станции связи'}
];
const PROOF = ['freq','one','all','peryton','night'];
const HEADLINES = [
  {t:'«ШОК! ЦУП поймал сигнал инопланетян и скрывает правду!»', d:-30, fake:true,
   r:'Миллион просмотров за час — и ни слова правды. Назавтра ролик разоблачили, а подписчики перестали верить Зое.'},
  {t:'«ЦУП дважды поймал неопознанный сигнал. Виновата микроволновка — рассказываю, как это выяснили»', d:10,
   r:'Честный заголовок и настоящая детективная история. Именно так работает хороший научный журналист.'},
  {t:'«Сегодня в ЦУПе ничего интересного не произошло»', d:0,
   r:'Честно, но скучно. А ведь самое интересное — как из шести версий осталась одна.'}
];

/* ===== Состояние ===== */
let S;
function reset(){
  S = {screen:'intro', lvl:0, v:0, step:0, trust:40, air:0, facts:[], fresh:null, sel:null,
       note:null, status:[[],[]], ok:0, miss:0, fakes:0, extra:0, proof:[], suspectDone:false, head:null};
}
const $ = s => document.querySelector(s);
function clamp(x){return Math.max(0, Math.min(100, x));}
function trust(d){S.trust = clamp(S.trust + d);}
function addFact(f){ if(!S.facts.includes(f)){S.facts.push(f); S.fresh = f;} }

/* ===== Отрисовка ===== */
function hud(){
  const h = $('#hud');
  if (['intro','end'].includes(S.screen)) { h.innerHTML=''; return; }
  const lv = S.screen==='deduce'||S.screen==='headline' ? {name:'Разгадка'} : LEVELS[S.lvl];
  const n = S.screen==='deduce'||S.screen==='headline' ? 3 : S.lvl+1;
  h.innerHTML = `<div class="hud">
    <div class="lvl">Уровень ${n} из 3<small>${lv.name}</small></div>
    <div class="meter"><div class="lab"><span>Доверие подписчиков</span><span>${S.trust}</span></div><div class="bar"><i style="width:${S.trust}%"></i></div></div>
    ${S.screen==='play' ? `<div class="air">Вопросов до эфира<br><b>${S.air}</b></div>` : ''}
  </div>`;
}
function notebook(selectable, multi){
  if (!S.facts.length) return '';
  return `<div class="panel"><h3>Блокнот Зои: факты</h3><div class="cards">${
    S.facts.map(f=>{
      const on = multi ? S.proof.includes(f) : S.sel===f;
      return `<button class="card ${on?'sel':''} ${S.fresh===f?'new':''}" ${selectable?`data-act="pick" data-f="${f}"`:'disabled style="opacity:1;cursor:default"'} aria-pressed="${on}">
        <b>${FACTS[f].t}</b><span>${FACTS[f].d}</span><em>Источник: ${FACTS[f].s}</em></button>`;
    }).join('')}</div></div>`;
}
function noteHtml(){ return S.note ? `<div class="note ${S.note.k}" role="status">${S.note.t}</div>` : ''; }

function render(){
  hud();
  const a = $('#app');
  a.innerHTML = ({intro:vIntro, brief:vBrief, tuner:vTuner, antennas:vAntennas, play:vPlay, deduce:vDeduce, headline:vHeadline, end:vEnd})[S.screen]();
  S.fresh = null;
  if (S.screen==='tuner') startTuner();
  $('#foot').innerHTML = `Игра по рассказу «Множество невидимых сущностей» (автор рассказа — А. И. Афанасьева) из вселенной
    <a href="https://edu.sputnix.ru/docs/cosmix/" target="_blank" rel="noopener">«Космикс: хроника поколения»</a> компании «Спутникс».
    ${AUTHOR?`<br>Автор игры: ${AUTHOR}. Конкурс SK Challenge 2026.`:''}`;
}

function vIntro(){
  return `<div class="panel">
    <div class="sub">Вселенная «Космикс: хроника поколения» · октябрь 2051 года</div>
    <h1>Сигнал 2,4:<br>расследование Зои</h1>
    <p>Московский ЦУП принял <b>неопознанный сигнал</b>. В зале пять знаменитых блогеров — и у каждого готова громкая версия: инопланетяне, тайная планета, космические частицы…</p>
    <p>Ты — <b>Зоя Волкова</b>. Тебе 13, и ты хочешь стать настоящей журналисткой. Собери факты, проверь каждую версию и найди, откуда на самом деле взялся сигнал.</p>
    <div class="row"><button class="primary" data-act="start">Начать расследование</button></div>
  </div>
  <div class="panel"><h3>Как играть</h3>

    <p>2. Нужного факта нет? Спроси Аврору или гостей. Но до эфира мало времени: лишние вопросы стоят доверия подписчиков.</p>
    <p>3. Если у версии вообще нет улик, доставай <b>бритву Оккама</b>: «Не плодите сущностей без надобности».</p>

  </div>
  <div class="panel"><h3>Герои</h3><div class="cast">${
    Object.keys(CH).map(k=>`<div>${ava(k,'sm')}<span><b>${CH[k].n}</b><small>${CH[k].r}</small></span></div>`).join('')
  }</div></div>`;
}

function vBrief(){
  const L = LEVELS[S.lvl];
  const shown = L.brief.slice(0, S.step+1).map(b=>say(b[0], b[1])).join('<div style="height:10px"></div>');
  const last = S.step >= L.brief.length-1;
  return `<div class="panel"><h2>Уровень ${S.lvl+1}. ${L.name}</h2>${shown}
    <div class="row" style="margin-top:14px"><button class="primary" data-act="${last?'mini':'next-brief'}">${last?(L.mini==='tuner'?'Включить приёмник':'Проверить антенны'):'Дальше'}</button></div></div>`;
}

/* --- Мини-игра 1: поймай частоту --- */
let tunerOn = false;
function vTuner(){
  return `<div class="panel"><h2>Поймай сигнал</h2>
    ${say('avrora','В записи много шума. Двигай ползунок и ищи узкий высокий пик. Когда он встанет точно на метку в центре — фиксируй частоту.')}
    <div style="height:12px"></div>
    <canvas id="cv" width="720" height="170" aria-label="Спектр радиосигнала"></canvas>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:8px">
      <div class="freq"><span id="fval">6,0</span> МГц</div><div class="sub">Уровень сигнала: <b id="lvl">0</b>%</div></div>
    <input type="range" id="tune" min="0.5" max="9.5" step="0.1" value="6" aria-label="Частота приёмника, мегагерцы">
    <div class="row"><button class="primary" data-act="lock">Зафиксировать частоту</button></div>
    ${noteHtml()}</div>`;
}
function startTuner(){
  const cv = $('#cv'), sl = $('#tune'); if(!cv) return;
  const ctx = cv.getContext('2d'); tunerOn = true;
  const N = 72, TARGET = 2.4;
  function frame(){
    if (!tunerOn || !document.body.contains(cv)) return;
    const f = parseFloat(sl.value), W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(W/2-1,0,2,H);
    let peak = 0;
    for (let i=0;i<N;i++){
      const fx = f - 1 + 2*i/(N-1);
      const sig = Math.exp(-Math.pow((fx-TARGET)/0.07,2));
      const noise = 0.08 + Math.random()*0.22;
      const v = Math.min(1, noise + sig*0.75);
      if (Math.abs(fx-f) < 0.04) peak = sig;
      const bw = W/N;
      ctx.fillStyle = sig>0.3 ? '#ffc46b' : '#3f66d9';
      ctx.fillRect(i*bw+1, H - v*(H-14), bw-2, v*(H-14));
    }
    $('#fval').textContent = f.toFixed(1).replace('.',',');
    $('#lvl').textContent = Math.round(Math.exp(-Math.pow((f-TARGET)/0.07,2))*100);
    requestAnimationFrame(frame);
  }
  frame();
}

/* --- Мини-игра 2: кто слышит сигнал --- */
const ANT = [
  {id:'io', t:'Спутники JuniX у Ио', r:'Тишина. Группировка у Ио этот сигнал не передавала.'},
  {id:'geo', t:'Спутники-ретрансляторы у Земли', r:'Тишина. На околоземной орбите всплеска нет.'},
  {id:'gal', t:'Антенна в Галенках, Приморский край', r:'Есть! Сигнал записан здесь — и только здесь.', hit:true}
];
function vAntennas(){
  S.ant = S.ant || {};
  const all = ANT.every(a=>S.ant[a.id]);
  return `<div class="panel"><h2>Кто слышит сигнал?</h2>
    ${say('zoya','Сигнал шёл длинным путём: спутники у Юпитера → ретрансляторы у Земли → наземная антенна. Прослушаю запись на каждом участке.')}
    <div class="asks" style="margin-top:12px">${ANT.map(a=>`<button data-act="ant" data-id="${a.id}">
      <span><b>${a.t}</b>${S.ant[a.id]?`<br><span style="color:${a.hit?'var(--ok)':'var(--mute)'}">${a.r}</span>`:''}</span>
      <span class="cost">${S.ant[a.id]?(a.hit?'сигнал':'пусто'):'прослушать'}</span></button>`).join('')}</div>
    ${all?`<div class="row" style="margin-top:14px"><button class="primary" data-act="to-play">Записать в блокнот и вернуться в зал</button></div>`:''}
  </div>`;
}

/* --- Основная игра: версии и факты --- */
function vPlay(){
  const L = LEVELS[S.lvl], V = L.versions[S.v];
  const chips = L.versions.map((x,i)=>{
    const st = S.status[S.lvl][i];
    return `<span class="chip ${st==='ok'?'done':st==='fake'?'fake':i===S.v?'cur':''}">${st==='ok'?'✓ ':st==='fake'?'✗ ':''}${i<=S.v?x.tag:'версия '+(i+1)}</span>`;
  }).join('');
  const done = S.status[S.lvl][S.v];
  const asks = L.asks.filter(q=>!S.facts.includes(q.f));
  return `<div class="panel">
      <h3>Версия ${S.v+1} из ${L.versions.length}</h3>
      ${done==='ok'?'<div class="stamp">ОПРОВЕРГНУТО</div>':''}
      ${say(V.who, V.text)}
      ${noteHtml()}
      ${done ? `<div class="row" style="margin-top:14px"><button class="primary" data-act="next-v">${S.v<L.versions.length-1?'Следующая версия':'Дальше'}</button></div>`
       : `<div class="row" style="margin-top:14px">
          <button class="primary" data-act="refute" ${S.sel?'':'disabled'}>${S.sel?'Опровергнуть этим фактом':'Выбери факт в блокноте'}</button>
          <button data-act="occam">Бритва Оккама: улик нет</button>
          <button class="ghost" data-act="believe">Поверить и запостить</button></div>`}
      <div class="chips">${chips}</div>
    </div>
    ${notebook(!done)}
    ${!done && asks.length ? `<div class="panel"><h3>Узнать больше</h3><div class="asks">${
      asks.map(q=>`<button data-act="ask" data-f="${q.f}">${ava(q.who,'sm')}<span>${q.q}</span><span class="cost">${S.air>0?'1 вопрос':'−5 доверия'}</span></button>`).join('')
    }</div></div>`:''}`;
}

/* --- Уровень 3: разгадка --- */
function vDeduce(){
  if (!S.suspectDone) return `<div class="panel"><h2>Уровень 3. Разгадка</h2>
      ${say('mom','Зоя, все версии гостей отпали. Может, у тебя есть своя?')}
      <p style="margin-top:12px">Перечитай блокнот. <b>Что создало сигнал?</b></p>
      <div class="asks">${SUSPECTS.map(s=>`<button data-act="suspect" data-id="${s.id}">${s.t}</button>`).join('')}</div>
      ${noteHtml()}</div>${notebook(false)}`;
  return `<div class="panel"><h2>Докажи!</h2>
      ${say('nika','Микроволновка? Смелая версия. Журналисту мало догадки — назови три улики.')}
      <p style="margin-top:12px">Выбери в блокноте <b>три факта</b>, которые указывают на микроволновку у антенны. Выбрано: <b>${S.proof.length}</b> из 3.</p>
      <div class="row"><button class="primary" data-act="prove" ${S.proof.length===3?'':'disabled'}>Предъявить улики</button></div>
      ${noteHtml()}</div>${notebook(true,true)}`;
}
function vHeadline(){
  return `<div class="panel"><h2>Звонок в обсерваторию</h2>
    ${say('mom','Мне только что сообщили: источником сигналов была микроволновая печь. Сотрудники ночной смены разогревали ужин, а у прибора была нарушена изоляция задней стенки. Тонко настроенная антенна ловила эти помехи.')}
    <div style="height:10px"></div>
    ${say('alisa','Не верю! Это инопланетяне, а руководство всё скрывает!')}
    <div style="height:10px"></div>
    ${say('zoya','Я семь лет верила каждому её слову… Ладно. Пора писать собственный пост. Какой заголовок выбрать?')}
    <div class="asks" style="margin-top:12px">${HEADLINES.map((h,i)=>`<button data-act="head" data-i="${i}">${h.t}</button>`).join('')}</div>
  </div>`;
}
function vEnd(){
  const h = HEADLINES[S.head];
  const t = S.trust;
  const rank = t>=90 ? 'Журналист с бритвой Оккама' : t>=70 ? 'Разрушитель мифов' : t>=45 ? 'Стажёр научной редакции' : 'Охотник за хайпом';
  const tip = t>=90 ? 'Ни одной лишней сущности. Тебя уже ждут в настоящей редакции!' : t>=70 ? 'Отличное расследование. Попробуй пройти без единой ошибки и лишних вопросов.' : t>=45 ? 'Правда найдена, но по дороге было много промахов. Сыграй ещё раз!' : 'Подписчики разбежались. Проверяй факты, прежде чем постить!';
  return `<div class="panel">
    <div class="note ${h.d<0?'bad':h.d>0?'ok':'info'}" style="margin-top:0"><b>Твой заголовок:</b> ${h.t}<br>${h.r}</div>
    <div style="height:14px"></div>
    ${say('mom','Скажу честно: это был мой эксперимент. Оба сообщения о сигналах подстроила я, а коллеги подыграли. Я хотела узнать, кто из блогеров создаст сенсацию, не зная всей картины, а кто дождётся фактов.')}
    <div style="height:10px"></div>
    ${say('mom','Даже очень умные люди ошибаются. Хороший журналист умеет распознавать не только чужую ложь, но и собственные ошибки. Не надо плодить лишних сущностей: ни о мире вокруг, ни о самой себе.')}
  </div>
  <div class="panel" style="text-align:center">
    <h3>Итог расследования</h3>
    <div class="big">${t}</div><div class="sub">доверие подписчиков из 100</div>
    <p class="rank" style="margin-top:10px">${rank}</p><p>${tip}</p>
    <div class="chips" style="justify-content:center">
      <span class="chip done">опровергнуто версий: ${S.ok}</span>
      <span class="chip ${S.miss?'cur':'done'}">промахов: ${S.miss}</span>
      <span class="chip ${S.extra?'cur':'done'}">лишних вопросов: ${S.extra}</span>
      <span class="chip ${S.fakes?'fake':'done'}">фейков в сети: ${S.fakes}</span>
    </div>
    <div class="row" style="margin-top:14px"><button class="primary" data-act="again">Сыграть ещё раз</button></div>
  </div>
  <div class="panel"><h3>Что такое бритва Оккама</h3>
    <p>Это правило мышления: если у явления есть несколько объяснений, начинай с самого простого. Сначала проверь микроволновку, грозу и неисправную антенну — и только потом зови инопланетян.</p></div>`;
}

/* ===== Действия ===== */
const NEEDED = [['wow','sun','mercury'],['weather','peryton']];
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, L = LEVELS[S.lvl];
  const keepScroll = ['pick','ask','ant'].includes(act);
  switch(act){
    case 'start': S.screen='brief'; S.step=0; break;
    case 'again': reset(); break;
    case 'next-brief': S.step++; break;
    case 'mini': S.note=null; S.screen=L.mini; break;
    case 'lock': {
      const f = parseFloat($('#tune').value);
      if (Math.abs(f-2.4) < 0.05){ tunerOn=false; addFact('freq'); S.air=L.air; S.v=0; S.sel=null;
        S.note={k:'ok',t:'Частота поймана: 2,4 МГц. Факт записан в блокнот. А теперь послушаем, что говорят гости.'}; S.screen='play'; }
      else { S.note={k:'bad',t: f<2.4?'Здесь только шум. Попробуй частоты повыше.':'Здесь только шум. Попробуй частоты пониже.'};
        const n=$('.note'); if(n){n.className='note bad';n.textContent=S.note.t;} else $('#app .panel').insertAdjacentHTML('beforeend',noteHtml()); return; }
      break; }
    case 'ant': S.ant[b.dataset.id]=true; break;
    case 'to-play': addFact('one'); S.air=L.air; S.v=0; S.sel=null;
      S.note={k:'ok',t:'Новый факт: сигнал слышит только одна наземная антенна.'}; S.screen='play'; break;
    case 'pick': {
      const f=b.dataset.f;
      if (S.screen==='deduce'){ const i=S.proof.indexOf(f); if(i>=0) S.proof.splice(i,1); else if(S.proof.length<3) S.proof.push(f); }
      else S.sel = S.sel===f ? null : f;
      break; }
    case 'ask': {
      const f=b.dataset.f;
      if (S.air>0) S.air--; else trust(-5);
      if (!NEEDED[S.lvl].includes(f)) S.extra++;
      addFact(f); S.note={k:'info',t:`Новый факт в блокноте: «${FACTS[f].t}».`};
      break; }
    case 'refute': case 'occam': {
      const V=L.versions[S.v], pick = act==='occam' ? 'occam' : S.sel;
      if (V.ans.includes(pick)){
        trust(5); S.ok++; S.status[S.lvl][S.v]='ok'; S.sel=null;
        S.note={k:'ok',t:`<b>Верно! +5 к доверию.</b> ${V.ok}`};
      } else {
        S.miss++;
        if (act==='occam'){ trust(-5); S.note={k:'bad',t:'<b>−5 к доверию.</b> Просто отмахнуться мало: эту версию можно проверить. Найди факт, который делает её невозможной, — или спроси о нём.'}; }
        else if (V.ans[0]==='occam'){ trust(-5); S.note={k:'bad',t:'<b>−5 к доверию.</b> Этот факт тут ни при чём. Присмотрись: а есть ли у версии хоть одна улика?'}; }
        else { trust(-10); S.note={k:'bad',t:'<b>−10 к доверию.</b> Этот факт не спорит с версией — подписчики заметили натяжку. Нужен факт, с которым версия не может быть правдой.'}; }
      }
      break; }
    case 'believe': {
      trust(-20); S.fakes++; S.status[S.lvl][S.v]='fake'; S.sel=null;
      S.note={k:'bad',t:'<b>−20 к доверию.</b> Зоя запостила непроверенную новость. Через час её разоблачили в комментариях. Обидно!'};
      break; }
    case 'next-v': {
      S.note=null; S.sel=null;
      if (S.v < L.versions.length-1) S.v++;
      else if (S.lvl < LEVELS.length-1){ S.lvl++; S.screen='brief'; S.step=0; }
      else { S.screen='deduce'; }
      break; }
    case 'suspect': {
      if (b.dataset.id==='micro'){ S.suspectDone=true; S.note=null;
        for (const f of ['all','night','peryton']) if (S.facts.filter(x=>PROOF.includes(x)).length<3) addFact(f); }
      else { trust(-10); S.miss++; S.note={k:'bad',t:'<b>−10 к доверию.</b> Эту версию ты уже опровергала. Вспомни историю «перетонов»: что тогда оказалось источником «космических» сигналов?'}; }
      break; }
    case 'prove': {
      const good = S.proof.every(f=>PROOF.includes(f));
      if (good){ trust(10); S.note=null; S.screen='headline'; }
      else { trust(-5); S.miss++; S.proof=[]; S.note={k:'bad',t:'<b>−5 к доверию.</b> Не все факты об этом. Ищи те, что говорят: источник рядом с антенной, он слабый, и такое уже случалось.'}; }
      break; }
    case 'head': { const i=+b.dataset.i; S.head=i; trust(HEADLINES[i].d); if(HEADLINES[i].fake) S.fakes++; S.screen='end'; break; }
  }
  const y = window.scrollY;
  render();
  window.scrollTo(0, keepScroll ? y : 0);
});

reset(); render();
</script>
