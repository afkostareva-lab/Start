.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}

/* список */
.grp{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin:18px 0 6px}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item .main{flex:1;min-width:0}

.item .ru{margin-top:1px}
.item .ex{font-size:14px;color:var(--muted);font-style:italic;margin-top:2px}
.item.known .en::after{content:" ✓";color:var(--ok)}

.flip{perspective:1000px;margin:6px 0 12px}

.big{font-size:30px;line-height:1.15;word-break:break-word}
.hint{position:absolute;bottom:10px;font-size:12px;color:var(--muted)}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

const W=RAW.trim().split("\n").map((l,i)=>{const[s,en,ru,ex]=l.split("|");return{id:i,s,en,ru,ex}});
const SECS=[...new Set(W.map(w=>w.s))];

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY="m3words";
let known=new Set();try{known=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...known]))}catch(e){}};
function say(t){try{if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t.replace(/\//g,","));u.lang='en-GB';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("#sec").innerHTML=`<option value="">все разделы</option>`+SECS.map(s=>`<option>${s}</option>`).join("");
let mode="list";
function pool(){const s=$("#sec").value,o=$("#only").value;return W.filter(w=>(!s||w.s===s)&&(o==="all"||!known.has(w.id)))}
function stats(){$("#sAll").textContent=W.length;$("#sKnown").textContent=known.size;$("#sSel").textContent=pool().length;$("#pbar").style.width=(known.size/W.length*100)+"%"}
function toggleKnown(id){known.has(id)?known.delete(id):known.add(id);save();stats()}

/* ---- список ---- */
function list(){
  const p=pool();let html=`<div class="row"><select id="hide"><option value="">показывать всё</option><option value="hide-ru">скрыть перевод</option><option value="hide-en">скрыть английский</option></select><button class="btn ghost" onclick="print()">🖨 Печать</button></div><div id="lst">`;
  let cur="";p.forEach(w=>{if(w.s!==cur){cur=w.s;html+=`<div class="grp">${esc(cur)}</div>`}
    html+=`<div class="item${known.has(w.id)?" known":""}" data-id="${w.id}"><button class="speak" data-say="${esc(w.en)}" aria-label="Произнести">🔊</button><div class="main"><div class="en">${esc(w.en)}</div><div class="ru">${esc(w.ru)}</div><div class="ex">${esc(w.ex)}</div></div><button class="know">знаю</button></div>`});
  if(!p.length)html+=`<p class="muted center">В выборке пусто. Все слова выучены 🎉</p>`;
  $("#view").innerHTML=html+"</div>";
  const lst=$("#lst"),h=$("#hide");
  h.onchange=()=>{lst.className=h.value;$$(".shown",lst).forEach(e=>e.classList.remove("shown"))};
  lst.onclick=e=>{const t=e.target,it=t.closest(".item");if(!it)return;
    if(t.dataset.say)say(t.dataset.say);
    else if(t.classList.contains("know")){toggleKnown(+it.dataset.id);it.classList.toggle("known")}
    else if(t.classList.contains("ru")||t.classList.contains("en"))t.classList.toggle("shown")};
}

/* ---- карточки ---- */
let deck=[],di=0;
function cards(reshuf=true){
  if(reshuf){deck=shuffle(pool());di=0}
  if(!deck.length){$("#view").innerHTML=`<p class="muted center">В выборке нет слов.</p>`;return}
  const w=deck[di],ru=$("#dir").value==="ru";
  const front=ru?w.ru:w.en,back=ru?w.en:w.ru;
  $("#view").innerHTML=`<p class="center muted small">${di+1} из ${deck.length} · ${esc(w.s)}</p>
   <div class="flip" id="flip"><div class="flip-in"><div class="face"><div class="big">${esc(front)}</div><span class="hint">нажми, чтобы перевернуть</span></div>
   <div class="face back"><div class="big">${esc(back)}</div><p class="muted" style="font-style:italic">${esc(w.ex)}</p></div></div></div>
   <div class="ctrl"><button class="btn ghost" id="prev">←</button><button class="speak" id="spk">🔊</button>
   <button class="btn ghost" id="again">Ещё учу</button><button class="btn" id="know">Знаю ✓</button><button class="btn ghost" id="next">→</button></div>`;
  $("#flip").onclick=()=>$("#flip").classList.toggle("turned");
  $("#spk").onclick=()=>say(w.en);
  const go=d=>{di=(di+d+deck.length)%deck.length;cards(false)};
  $("#prev").onclick=()=>go(-1);$("#next").onclick=()=>go(1);$("#again").onclick=()=>{known.delete(w.id);save();stats();go(1)};
  $("#know").onclick=()=>{known.add(w.id);save();stats();go(1)};
  if(!ru)say(w.en);
}

/* ---- тест ---- */
let qz={list:[],i:0,right:0};
function quiz(start=true){
  if(start){qz={list:shuffle(pool()).slice(0,15),i:0,right:0}}
  const v=$("#view");
  if(!qz.list.length){v.innerHTML=`<p class="muted center">В выборке нет слов.</p>`;return}
  if(qz.i>=qz.list.length){v.innerHTML=`<div class="card center"><div class="big">${qz.right} / ${qz.list.length}</div><p>${qz.right===qz.list.length?"Отлично, без ошибок!":qz.right>=qz.list.length*.7?"Хорошо! Ошибки повтори в списке.":"Стоит повторить слова и пройти ещё раз."}</p><button class="btn" id="re">Новый тест</button></div>`;$("#re").onclick=()=>quiz();return}
  const w=qz.list[qz.i],ru=$("#dir").value==="ru";
  const others=shuffle(W.filter(x=>x.id!==w.id&&(x.s===w.s||Math.random()<.3))).slice(0,3);
  const opts=shuffle([w,...others]);
  v.innerHTML=`<div class="card"><p class="center muted small">Вопрос ${qz.i+1} из ${qz.list.length} · верно: ${qz.right}</p>
   <div class="q-word big">${esc(ru?w.ru:w.en)}</div>${ru?"":`<div class="center"><button class="speak" id="spk">🔊</button></div>`}
   <div class="choices">${opts.map(o=>`<button class="choice" data-id="${o.id}">${esc(ru?o.en:o.ru)}</button>`).join("")}</div>
   <div class="fb" id="fb"></div></div>`;
  if(!ru){$("#spk").onclick=()=>say(w.en);say(w.en)}
  $$(".choice").forEach(b=>b.onclick=()=>{const ok=+b.dataset.id===w.id;
    $$(".choice").forEach(x=>{x.disabled=true;if(+x.dataset.id===w.id)x.classList.add("right")});
    if(!ok)b.classList.add("wrong");else{qz.right++;known.add(w.id);save();stats()}
    $("#fb").innerHTML=`<span class="muted" style="font-weight:400;font-style:italic">${esc(w.ex)}</span>`;
    if(ru)say(w.en);
    setTimeout(()=>{qz.i++;quiz(false)},ok?1100:2200)});
}

/* ---- написание ---- */
let sp={list:[],i:0,right:0};
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[.?!,]/g,"").replace(/\s+/g," ").trim();
function spell(start=true){
  if(start){sp={list:shuffle(pool()).slice(0,15),i:0,right:0}}
  const v=$("#view");
  if(!sp.list.length){v.innerHTML=`<p class="muted center">В выборке нет слов.</p>`;return}
  if(sp.i>=sp.list.length){v.innerHTML=`<div class="card center"><div class="big">${sp.right} / ${sp.list.length}</div><p>Слова написаны без ошибок: ${sp.right}.</p><button class="btn" id="re">Ещё раз</button></div>`;$("#re").onclick=()=>spell();return}
  const w=sp.list[sp.i];
  v.innerHTML=`<div class="card"><p class="center muted small">Слово ${sp.i+1} из ${sp.list.length} · напиши по-английски</p>
   <div class="q-word big">${esc(w.ru)}</div>
   <p class="center muted small">Первая буква: <b>${esc(w.en[0])}</b> · букв: ${w.en.replace(/[^a-zA-Z]/g,"").length}</p>
   <input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here">
   <div class="fb" id="fb"></div>
   <div class="ctrl" style="margin-top:8px"><button class="btn" id="chk">Проверить</button><button class="btn ghost" id="skip">Не знаю</button></div></div>`;
  const inp=$("#inp");inp.focus();
  const accept=norm(w.en).split(" / ").concat(norm(w.en)).concat(norm(w.en.replace(/\s*\(.*?\)/g,"")));
  let done=false;
  const finish=ok=>{done=true;inp.disabled=true;inp.classList.add(ok?"good":"badi");
    $("#fb").innerHTML=ok?"Верно!":`Правильно: <span style="color:var(--ok)">${esc(w.en)}</span>`;
    if(ok){sp.right++;known.add(w.id);save();stats()}say(w.en);
    $("#chk").textContent="Дальше →";$("#skip").style.display="none"};
  const next=()=>{sp.i++;spell(false)};
  $("#chk").onclick=()=>{if(done)return next();if(!inp.value.trim())return;finish(accept.includes(norm(inp.value)))};
  inp.onkeydown=e=>{if(e.key==="Enter")$("#chk").click()};
  $("#skip").onclick=()=>finish(false);
}

const R={list,cards,quiz,spell};
function render(){stats();R[mode]()}
$("#modes").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;mode=b.dataset.m;$$(".tab").forEach(t=>t.classList.toggle("on",t===b));render()};
["#sec","#only","#dir"].forEach(s=>$(s).onchange=render);
(function(){const r=document.documentElement;let t=null;try{t=localStorage.getItem("m3theme")}catch(e){}
  if(t)r.dataset.theme=t;
  $("#themeBtn").onclick=()=>{const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("m3theme",r.dataset.theme)}catch(e){}}})();
render();
</script>
</body>
