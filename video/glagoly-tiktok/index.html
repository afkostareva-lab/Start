<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Фон","default":"#ECF2D8"},
    {"id":"color-ink","type":"color","label":"Текст","default":"#4a2a38"},
    {"id":"color-accent","type":"color","label":"Акцент","default":"#E27396"},
    {"id":"hook-line1","type":"string","label":"Заголовок, строка 1","default":"Неправильные"},
    {"id":"hook-line2","type":"string","label":"Заголовок, строка 2","default":"глаголы"},
    {"id":"hook-line3","type":"string","label":"Заголовок, плашка","default":"без напряга"},
    {"id":"cta","type":"string","label":"Призыв в конце","default":"Ссылка на тренажёр — под видео"},
    {"id":"cta-url","type":"string","label":"Ссылка в конце","default":"afkostareva-lab.github.io/Start"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ecf2d8;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--color-ground, #ecf2d8);
        z-index: 0;
      }
      .film {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45"
      data-width="1080"
      data-height="1920"
    >
      <div id="ground"></div>

      <!-- 0 – 7 s: intro, her own words -->
      <video
        id="intro-video"
        class="clip film"
        src="assets/video/clip_2165.mp4"
        data-start="0"
        data-duration="7"
        data-media-start="0.4"
        data-track-index="0"
        data-has-audio="true"
        data-volume="1"
        playsinline
        style="z-index: 1"
      ></video>

      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>

      <!-- 6.7 – 39.9 s: the trainer on the phone screen, under the voiceover -->
      <div
        id="demo"
        data-composition-id="demo"
        data-composition-src="compositions/demo.html"
        data-start="6.7"
        data-duration="33.2"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>

      <!-- 39.3 – 45 s: outro -->
      <video
        id="outro-video"
        class="clip film"
        src="assets/video/clip_2169.mp4"
        data-start="39.3"
        data-duration="5.7"
        data-media-start="0.6"
        data-track-index="0"
        data-has-audio="true"
        data-volume="1"
        playsinline
        style="z-index: 2"
      ></video>

      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="42"
        data-duration="3"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 6"
      ></div>

      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="45"
        data-track-index="4"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 7"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
