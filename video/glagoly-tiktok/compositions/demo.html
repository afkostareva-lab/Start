                  card: "#fffdf8", ink: "#4a2a38", bg: "#ECF2D8" };
    const S_TOP = 0, S_TABS = 135, S_CARD = 231, S_GROUPS = 354;

    // initial state (set at 0 so every seek starts clean)
    tl.set("#dm-page", { y: 0 }, 0);
    tl.set("#dm-cam", { x: 0, y: 0, scale: 1 }, 0);
    tl.set("#pg-tabs-in", { x: 0 }, 0);
    tl.set("#dm-touch", { opacity: 0, scale: 1 }, 0);

    // ---- helpers
    function scroll(t, s, dur, ease) { tl.to("#dm-page", { y: -s, duration: dur, ease: ease || "power2.inOut" }, t); }
    function cam(t, z, fx, fy, FX, FY, s, dur, ease) {
      // put page point (fx,fy) at frame point (FX,FY) at zoom z, given page scroll s
      const sx = fx * K, sy = (54 + fy - s) * K;
      let x = FX - z * sx, y = FY - z * sy;
      x = Math.min(0, Math.max(1080 - 1080 * z, x)); y = Math.min(0, Math.max(1920 - 1920 * z, y));
      tl.to("#dm-cam", { x, y, scale: z, duration: dur, ease: ease || "power2.inOut" }, t);
    }
    function camReset(t, dur) { tl.to("#dm-cam", { x: 0, y: 0, scale: 1, duration: dur, ease: "power2.inOut" }, t); }
    function tap(t, p) {
      tl.set("#dm-touch", { x: p.x, y: p.y }, t - 0.1);
      tl.fromTo("#dm-touch", { opacity: 0, scale: 0.75 }, { opacity: 1, scale: 1, duration: 0.07, ease: "power2.out", immediateRender: false }, t - 0.07);
      tl.to("#dm-touch", { opacity: 0, duration: 0.16, ease: "power1.in" }, t + 0.12);
    }
    function swipe(t, from, to, tabsTo, dur) {
      tl.set("#dm-touch", { x: from.x, y: from.y }, t - 0.08);
      tl.fromTo("#dm-touch", { opacity: 0 }, { opacity: 1, duration: 0.06, immediateRender: false }, t - 0.06);
      tl.to("#dm-touch", { x: to.x, y: to.y, duration: dur * 0.7, ease: "power1.inOut" }, t);
      tl.to("#dm-touch", { opacity: 0, duration: 0.12 }, t + dur * 0.7);
      tl.to("#pg-tabs-in", { x: tabsTo, duration: dur, ease: "power3.out" }, t);
    }
    function tabOn(t, on, off) {
      tl.set("#" + on, { backgroundColor: COL.accent, color: "#fff", borderColor: COL.accent }, t);
      tl.set("#" + off, { backgroundColor: COL.card, color: COL.ink, borderColor: COL.line }, t);
    }
    function panel(t, show, hide) { tl.set("#" + hide, { opacity: 0 }, t); tl.set("#" + show, { opacity: 1 }, t); }
    function label(id, tIn, tOut, mode) {
      const box = "#" + id;
      if (mode === "words") {
        tl.set(box, { opacity: 1, filter: "blur(0px)" }, tIn);
        tl.fromTo(box + " .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.09, ease: "power2.out" }, tIn);
      } else if (mode === "wipe") {
        tl.fromTo(box, { opacity: 1, clipPath: "inset(0% 100% 0% 0% round 26px)" }, { clipPath: "inset(0% 0% 0% 0% round 26px)", duration: 0.32, ease: "expo.out" }, tIn);
      } else {
        tl.fromTo(box, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, tIn);
      }
      tl.to(box, { opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in" }, tOut);
    }
    function good(t, id) { tl.set("#" + id, { borderColor: COL.ok, backgroundColor: COL.okBg }, t); }

    // ---- 0. app opens over the intro (0.0 - 0.5)
    tl.fromTo("#dm-cam", { y: 520, scale: 0.8, x: 108 }, { y: 0, scale: 1, x: 0, duration: 0.5, ease: "power3.out", immediateRender: true }, 0);
    tl.fromTo("#dm-screen", { borderRadius: 18 }, { borderRadius: 0, duration: 0.5, ease: "power3.out" }, 0);

    // ---- B1. the four groups (0.5 - 4.8)
    scroll(0.6, S_GROUPS, 0.9);
    label("lbl1", 1.25, 4.6);
    tl.to("#grp-ABC", { borderColor: COL.accent, backgroundColor: "#fbe3ec", duration: 0.25, ease: "power2.out" }, 2.6);
    tl.fromTo("#grp-ABC", { boxShadow: "0 0 0 0px rgba(226,115,150,0)" }, { boxShadow: "0 0 0 1.5px rgba(226,115,150,1)", duration: 0.25, ease: "power2.out" }, 2.6);

    // ---- B2. «Напиши»: goed -> went (4.8 - 12.0)
    scroll(4.8, S_TABS, 0.55);
    tap(5.5, { x: 330, y: C("tab-type").y });
    tabOn(5.5, "tab-type", "tab-table"); panel(5.5, "pn-type", "pn-table");
    scroll(5.75, S_CARD, 0.55);
    // focus V2, type goed
    tap(6.45, C("ty-v2"));
    tl.set("#ty-v2", { borderColor: COL.accent }, 6.45); tl.set("#ty-v2-c", { opacity: 1, x: 0 }, 6.45);
    const typeAt = (field, t0) => {
      for (let i = 1; i <= 4; i++) {
        const t = t0 + (i - 1) * 0.18;
        if (i > 1) tl.set(`#ty-${field}-${i - 1}`, { opacity: 0 }, t);
        tl.set(`#ty-${field}-${i}`, { opacity: 1 }, t);
        tl.set(`#ty-${field}-c`, { x: POS[`ty-${field}-${i}`].w }, t);
      }
    };
    typeAt("v2", 6.65);
    tap(7.55, C("ty-v3"));
    tl.set("#ty-v2", { borderColor: COL.line }, 7.55); tl.set("#ty-v2-c", { opacity: 0 }, 7.55);
    tl.set("#ty-v3", { borderColor: COL.accent }, 7.55); tl.set("#ty-v3-c", { opacity: 1, x: 0 }, 7.55);
    typeAt("v3", 7.75);
    tap(8.85, C("ty-go"));
    tl.set("#ty-v3-c", { opacity: 0 }, 8.9);
    tl.set("#ty-v2", { borderColor: COL.bad, backgroundColor: COL.badBg }, 8.9);
    tl.set("#ty-v3", { borderColor: COL.ok, backgroundColor: COL.okBg }, 8.9);
    tl.set(["#ty-v2-fix", "#ty-v3-fix"], { opacity: 1 }, 8.9);
    tl.set("#ty-go", { opacity: 0 }, 8.9); tl.set("#ty-next", { opacity: 1 }, 8.9); tl.set("#ty-hint", { opacity: 0 }, 8.9);
    tl.set(["#st-ok", "#st-n"], { textContent: (i) => ["0", "1"][i] }, 8.9);
    tl.set("#st-streak", { textContent: "5" }, 8.9);
    cam(9.2, 1.22, 195, 536, 540, 830, S_CARD, 0.7);
    label("lbl2", 9.55, 11.85, "words");
    camReset(12.0, 0.55);

    // ---- B3. «Выбери» (12.0 - 17.0)
    scroll(12.0, S_TABS, 0.55);
    swipe(12.55, { x: 300, y: 201 }, { x: 110, y: 201 }, -272, 0.4);
    tap(13.15, { x: POS["tab-choice"].x - 272 + POS["tab-choice"].w / 2, y: C("tab-choice").y });
    tabOn(13.15, "tab-choice", "tab-type"); panel(13.15, "pn-choice", "pn-type");
    scroll(13.35, S_CARD, 0.55);
    label("lbl3", 13.85, 16.85, "wipe");
    tap(15.0, C("ch0-o2")); good(15.0, "ch0-o2");
    tl.set(["#st-ok", "#st-n"], { textContent: (i) => ["1", "2"][i] }, 15.0);
    panel(15.6, "ch1", "ch0");
    tap(16.4, C("ch1-o1")); good(16.4, "ch1-o1");
    tl.set(["#st-ok", "#st-n"], { textContent: (i) => ["2", "3"][i] }, 16.4);
    panel(17.0, "ch2", "ch1");

    // ---- B4. карточки (17.0 - 21.7)
    scroll(17.15, S_TABS, 0.5);
    swipe(17.65, { x: 110, y: 201 }, { x: 300, y: 201 }, 0, 0.4);
    tap(18.2, C("tab-cards"));
    tabOn(18.2, "tab-cards", "tab-choice"); panel(18.2, "pn-cards", "pn-choice");
    scroll(18.4, S_CARD, 0.55);
    label("lbl4", 19.0, 21.5);
    tap(19.4, C("cd-flip"));
    tl.fromTo("#cd-flip-in", { rotationY: 0 }, { rotationY: 180, duration: 0.5, ease: "power1.inOut" }, 19.4);
    tl.set("#cd-btns", { opacity: 1 }, 19.42);
    tl.set("#cd-speak", { borderColor: COL.accent, backgroundColor: "#fbe3ec" }, 19.5);
    tl.set("#cd-speak", { borderColor: COL.line, backgroundColor: COL.card }, 21.2);

    // ---- B5. «На время» (21.7 - 28.6)
    scroll(21.7, S_TABS, 0.5);
    swipe(22.15, { x: 300, y: 201 }, { x: 110, y: 201 }, -272, 0.4);
    tap(22.75, { x: POS["tab-speed"].x - 272 + POS["tab-speed"].w / 2, y: C("tab-speed").y });
    tabOn(22.75, "tab-speed", "tab-cards"); panel(22.75, "pn-speed0", "pn-cards");
    scroll(22.95, S_CARD, 0.5);
    label("lbl5", 23.3, 28.45, "words");
    tap(23.85, C("sp-start"));
    panel(23.9, "pn-speed1", "pn-speed0");
    const RUN0 = 23.9, RUN1 = 27.6, N = 9, STEP = (RUN1 - RUN0) / N;
    const CORRECT = [0, 2, 1, 3, 1, 0, 2, 1, 3];
    const SCORE = [2, 4, 6, 7, 9, 11, 13, 15, 17];
    const timer = { v: 60 };
    tl.fromTo(timer, { v: 60 }, { v: 1, duration: RUN1 - RUN0, ease: "none",
      onUpdate: () => { el("sp-timer").textContent = Math.max(1, Math.round(timer.v)); } }, RUN0);
    for (let i = 0; i < N; i++) {
      const t = RUN0 + i * STEP;
      if (i > 0) panel(t, "sp" + i, "sp" + (i - 1));
      const tt = t + STEP * 0.62;
      tap(tt, C(`sp${i}-o${CORRECT[i]}`)); good(tt, `sp${i}-o${CORRECT[i]}`);
      tl.set("#sp-score", { textContent: String(SCORE[i]) }, tt);
    }
    panel(RUN1 + 0.05, "pn-speed2", "pn-speed1");
    tl.set("#st-best", { opacity: 1 }, RUN1 + 0.05);
    tl.set(["#st-ok", "#st-n"], { textContent: (i) => ["19", "22"][i] }, RUN1 + 0.05);
    tl.set("#st-learn-n", { textContent: "24" }, RUN1 + 0.05);
    tl.set("#pg-bar", { width: (24 / 118 * 100).toFixed(1) + "%" }, RUN1 + 0.05);
    // the payoff: push in on the trophy card as the record lands
    cam(RUN1 + 0.1, 1.3, 195, 467, 540, 960, S_CARD, 0.6, "power3.out");

    // ---- B6. прогресс (28.6 - 32.6)
    scroll(28.7, S_TOP, 0.8);
    camReset(28.7, 0.8);
    label("lbl6", 29.6, 32.35);
    tl.to("#st-learn", { borderColor: COL.accent, duration: 0.2 }, 29.9);
    tl.to("#st-best", { borderColor: COL.accent, duration: 0.2 }, 30.5);

    // ---- close: the screen shrinks away onto the outro (32.6 - 33.2)
    tl.to("#dm-screen", { borderRadius: 18, duration: 0.25, ease: "power2.in" }, 32.6);
    tl.to("#dm-cam", { y: 1500, x: 140, scale: 0.74, duration: 0.55, ease: "power3.in" }, 32.6);
    tl.to("#dm-cam", { opacity: 0, duration: 0.12 }, 33.05);

    window.__timelines["demo"] = tl;

  </script>
</template>
