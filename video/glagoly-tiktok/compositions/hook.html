<template id="hook-template">
  <style>
    @font-face {
      font-family: "Playfair Display";
      src: url("assets/fonts/PlayfairDisplay-Black-latin.woff2") format("woff2");
      font-weight: 900;
    }
    @font-face {
      font-family: "Playfair Display";
      src: url("assets/fonts/PlayfairDisplay-Black-cyrillic.woff2") format("woff2");
      font-weight: 900;
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    #root {
      position: absolute;
      inset: 0;
    }
    #hook-title {
      position: absolute;
      left: 72px;
      top: 214px;
      width: 936px;
      font: 900 124px/0.98 "Playfair Display", Georgia, serif;
      letter-spacing: -0.01em;
      color: var(--color-ink, #4a2a38);
      text-shadow: 0 2px 18px rgba(255, 255, 255, 0.55);
    }
    #hook-title .ln {
      display: block;
    }
    #hook-tag {
      display: inline-block;
      margin-top: 22px;
      padding: 10px 30px 18px;
      border-radius: 22px;
      background: #c94f77;
      color: #fffdf8;
      font-size: 104px;
      text-shadow: none;
    }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="hook-title" class="clip" data-start="0" data-duration="7" data-track-index="0">
      <span class="ln" id="hook-l1" data-var-text="hook-line1">Неправильные</span>
      <span class="ln" id="hook-l2" data-var-text="hook-line2">глаголы</span>
      <span id="hook-tag" data-var-text="hook-line3">без напряга</span>
    </div>
  </div>
  <script>
    // Frame 0 is the thumbnail: the whole title is already on screen and holds dead still.
    // The one move: the pink tag lands again when she says «без напряга» (5.2 s).
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#hook-tag", { scale: 1 }, { scale: 1.06, duration: 0.12, ease: "power2.out", transformOrigin: "0% 50%" }, 5.2);
    tl.to("#hook-tag", { scale: 1, duration: 0.35, ease: "power3.out" }, 5.32);
    window.__timelines["hook"] = tl;
  </script>
</template>
