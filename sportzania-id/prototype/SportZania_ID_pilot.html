<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F1D">
<title>SportZania ID — пилот цифрового паспорта резидента</title>
<meta name="description" content="Кликабельный пилот цифрового паспорта ребёнка для лагеря и онлайн-школы SportZania. Sk Kids Challenge 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F1EA;--card:#FCFBF9;--ink:#0A0F1D;--cobalt:#1D4ED8;--tint:#DBEAFE;--green:#10B981;--red:#EF4444;--slate:#475569;--line:#CBD5E1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-weight:500;color:var(--ink);background:var(--paper) radial-gradient(#d6d0c2 1px,transparent 1px) 0 0/20px 20px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:inherit}
h1,h2,h3,h4{font-weight:900}
.stage{min-height:100%;display:flex;gap:56px;align-items:center;justify-content:center;padding:24px}
/* Пояснение слева (на компьютере) */
.about{width:360px}
.about .mast{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:12px;margin-bottom:14px}
.about h1{font-size:38px;color:var(--cobalt);letter-spacing:-1px;line-height:.95}
.about .sub{font-weight:800;letter-spacing:3px;font-size:12px;margin-top:6px}
.about .lead{font-size:14.5px;color:var(--slate);margin-bottom:14px}
.todo{display:grid;gap:7px;list-style:none}
.todo li{display:grid;grid-template-columns:22px 1fr;gap:9px;font-size:14px;font-weight:700;align-items:start}
.todo i{width:20px;height:20px;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;margin-top:1px}
.todo .ok i{background:var(--green)}.todo .ok i::after{content:"";width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.todo .ok{color:var(--slate);text-decoration:line-through;text-decoration-thickness:1px}
.about .foot{margin-top:16px;font-size:11px;font-weight:800;letter-spacing:1.5px;border-top:3px solid var(--ink);padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.barcode{height:26px;width:86px;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 5px,var(--ink) 5px 6px,transparent 6px 10px,var(--ink) 10px 14px,transparent 14px 16px)}
/* Телефон */
.phone{width:390px;height:844px;flex:none;background:var(--paper);border:3px solid var(--ink);border-radius:38px;box-shadow:12px 12px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;position:relative}
.demo{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink)}
.demo button{color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:9px 2px 8px;text-align:center;opacity:.72}
.demo button+button{border-left:1px solid #334155}
.demo .on{background:var(--cobalt);opacity:1}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:3px solid var(--ink);background:var(--paper)}
.brand{background:var(--ink);color:#fff;font-weight:900;font-size:12px;letter-spacing:1px;padding:7px 9px;white-space:nowrap}
.top .where{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--cobalt);margin-left:2px}
.top .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.pill{border:2px solid var(--ink);background:#fff;font-size:11.5px;font-weight:900;padding:4px 7px;white-space:nowrap}
.help{width:28px;height:28px;border:2px solid var(--ink);background:var(--cobalt);color:#fff;font-weight:900;text-align:center;font-size:14px}
main{flex:1;overflow-y:auto;padding:14px 14px 24px;display:grid;gap:14px;align-content:start}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:3px solid var(--ink);background:var(--card)}
.tabs button{padding:9px 2px 11px;font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;display:grid;gap:3px;justify-items:center;position:relative}
.tabs button+button{border-left:2px solid var(--ink)}
.tabs svg{width:22px;height:22px}
.tabs .on{background:var(--cobalt);color:#fff}
.tabs .lock::after,.tabs .dot::after{content:"";position:absolute;top:6px;right:12px;width:9px;height:9px;background:var(--red);border:1.5px solid var(--ink)}
.tabs .dot::after{border-radius:50%;background:var(--green)}
/* Блоки */
.card{background:var(--card);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.bar{background:var(--ink);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar::after{content:"";width:40px;height:13px;flex:none;background:repeating-linear-gradient(115deg,var(--cobalt) 0 5px,transparent 5px 9px)}
.bar.plain::after{display:none}
.bar>span:first-child{margin-right:auto}
.pad{padding:12px}
.g{display:grid;gap:10px}
.h{font-size:18px;font-weight:900;letter-spacing:-.3px;line-height:1.15}
.h.s{font-size:15.5px}
.muted{color:var(--slate);font-size:13px}
.cap{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--cobalt)}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.btn{display:block;width:100%;background:var(--ink);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;padding:12px;border:2px solid var(--ink);text-align:center}
.btn.cobalt{background:var(--cobalt)}.btn.green{background:var(--green)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{width:auto;padding:7px 10px;font-size:10.5px;flex:none}
.btn[disabled]{background:var(--line);border-color:var(--line);color:var(--slate);cursor:default}
.btn:active:not([disabled]){transform:translate(2px,2px)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:2px solid var(--ink);background:#fff;padding:6px 10px;font-size:12.5px;font-weight:700}
.chip.on{background:var(--cobalt);color:#fff}.chip.green{background:var(--green);color:#fff}
.chip.flat{border-width:1.5px;padding:3px 7px;font-size:11px}
.tag{display:inline-block;background:var(--ink);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:3px 6px;white-space:nowrap}
.tag.green{background:var(--green)}.tag.red{background:var(--red)}.tag.cobalt{background:var(--cobalt)}.tag.out{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.ava{width:50px;height:50px;border:2px solid var(--ink);border-radius:50%;object-fit:cover;background:var(--tint);display:grid;place-items:center;font-weight:900;font-size:17px;color:var(--cobalt);flex:none}
.ava.s{width:38px;height:38px;font-size:13px}
.ava.me{background:var(--ink);color:#fff;font-size:12px}
.ava.hit{outline:4px solid var(--green);outline-offset:1px}
.ava.dim{opacity:.3}
/* Паспорт */
.hero{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center}
.hero img{width:112px;height:112px;object-fit:cover;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.nick{font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1.1}
.lvl{display:inline-block;background:var(--ink);color:#fff;font-size:10px;font-weight:800;letter-spacing:1px;padding:4px 7px;margin-top:5px}
.lvl.res{background:var(--cobalt)}
.prog{height:12px;border:2px solid var(--ink);background:#fff}.prog i{display:block;height:100%;background:var(--cobalt);transition:width .3s}
.prog.gr i{background:var(--green)}
.plate{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:linear-gradient(118deg,#fff 0,#d8dee7 28%,#94a3b8 52%,#e2e8f0 74%,#fff 100%)}
.plate div{padding:8px 12px}.plate div+div{border-left:2px solid var(--ink)}
.plate b{display:block;font-size:23px;font-weight:900;line-height:1.1;text-shadow:1px 1px 0 #fff}
.plate span{font-size:9.5px;font-weight:800;letter-spacing:1.2px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days i{font-style:normal;border:2px solid var(--ink);text-align:center;font-size:11px;font-weight:900;padding:5px 0;background:#fff}
.days i.on{background:var(--cobalt);color:#fff}.days i.now{background:var(--green);color:#fff}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border:2px solid var(--ink);background:#fff;padding:8px 5px;text-align:center;font-size:10.5px;font-weight:800;line-height:1.2;display:grid;gap:5px;justify-items:center;align-content:start}
.badge svg{width:28px;height:28px;padding:4px;background:var(--cobalt);color:#fff;border:2px solid var(--ink)}
.badge.off{background:transparent;border-style:dashed;color:var(--slate)}
.badge.off svg{background:var(--line);color:var(--slate);border-color:var(--slate)}
.badge small{font-weight:700;font-size:9.5px;color:var(--slate)}
.feed{display:grid}
.feed div{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;font-weight:700}
.feed div:first-child{border-top:0}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;font-weight:700;width:100%}
.tog:first-child{border-top:0}
.sw{width:42px;height:24px;border:2px solid var(--ink);background:#fff;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--ink);transition:left .15s}
.sw.on{background:var(--green)}.sw.on::after{left:20px}
.only{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;font-weight:700;width:100%}
.only:first-child{border-top:0}.only svg,.row>svg{width:21px;height:21px;flex:none}
.only small{display:block;font-weight:600;color:var(--slate);font-size:12px;margin-top:2px}
.lockbox{border:2px dashed var(--ink);padding:22px 14px;text-align:center;display:grid;gap:10px;justify-items:center}
.lockbox svg{width:44px;height:44px}
.note{font-size:12px;color:var(--slate);border:1.5px dashed var(--slate);padding:8px 10px}
/* Город */
.map{background:var(--cobalt) linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px) 0 0/100% 22px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px;display:grid;gap:10px}
.block{border:1.5px solid #fff;background:rgba(255,255,255,.1);padding:8px 8px 10px}
.block.my{background:rgba(255,255,255,.2);border-width:2.5px}
.block h4{color:#fff;font-size:10.5px;letter-spacing:1.2px;margin-bottom:8px;display:flex;justify-content:space-between;text-transform:uppercase}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px}
.res{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:800;color:#fff;text-align:center;align-content:start}
.res .ava{border-color:#fff}
.res .tag{font-size:8.5px;padding:2px 4px}
/* Проекты */
.kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;font-size:13.5px}
.kv dt{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--cobalt);padding-top:2px}
.kv dd{font-weight:700}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps div{font-size:10.5px;font-weight:800;text-align:center;padding:6px 2px;border:2px solid var(--ink);background:#fff}
.steps .ok{background:var(--green);color:#fff}.steps .now{background:var(--cobalt);color:#fff}
.quote{border-left:4px solid var(--green);padding:6px 10px;background:#fff;font-size:13px}
.pic{height:86px;border:2px solid var(--ink);background:var(--tint) repeating-linear-gradient(135deg,rgba(29,78,216,.1) 0 8px,transparent 8px 16px);display:grid;place-items:center;color:var(--cobalt)}
.pic svg{width:44px;height:44px}
/* Вечер */
.slider{-webkit-appearance:none;appearance:none;width:100%;height:18px;border:2px solid var(--ink);background:linear-gradient(90deg,#EF4444,#FDE68A 50%,#10B981);margin:8px 0}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1 55%,#64748b);box-shadow:2px 2px 0 var(--ink)}
.slider::-moz-range-thumb{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1 55%,#64748b)}
.slider:disabled{opacity:.65}
.scale{display:flex;justify-content:space-between;font-size:11.5px;font-weight:900;letter-spacing:.5px}
.status{border:2px dashed var(--cobalt);background:var(--tint);color:var(--cobalt);font-weight:900;font-size:13.5px;text-align:center;padding:8px}
.lb{display:flex;justify-content:space-between;padding:7px 10px;font-size:13px;font-weight:700;border-top:1px solid var(--line)}
.lb.me{background:var(--tint);color:var(--cobalt);font-weight:900}
.seg{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--ink)}
.seg button{padding:8px;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;text-align:center}
.seg button+button{border-left:2px solid var(--ink)}.seg .on{background:var(--cobalt);color:#fff}
img.wide{display:block;width:100%;border-bottom:2px solid var(--ink)}
/* Вожатый, преподаватель, родитель */
.bars{display:flex;align-items:flex-end;gap:8px;height:74px}
.bars i{flex:1;background:var(--green);border:2px solid var(--ink);position:relative}
.bars i.low{background:var(--red)}
.bars i span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-style:normal;font-size:10px;font-weight:800}
.kid{display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.kid:first-child{border-top:0}
.mini{display:grid;grid-template-columns:1fr repeat(4,48px);font-size:11.5px;font-weight:700}
.mini>*{padding:6px 2px;border-top:1px solid var(--line);display:grid;place-items:center}
.mini>*:nth-child(5n+1){place-items:center start;padding-left:0}
.mini .hd{font-size:7.5px;font-weight:800;letter-spacing:.2px;text-transform:uppercase;color:var(--slate);border-top:0}
.mini b{width:16px;height:16px;border:1.5px solid var(--ink);background:var(--green)}.mini b.no{background:var(--red)}
/* Панели */
.sheet{position:absolute;inset:0;background:rgba(10,15,29,.55);display:flex;align-items:flex-end;z-index:5}
.sheet>div{width:100%;background:var(--paper);border-top:3px solid var(--ink);padding:16px 14px 20px;display:grid;gap:12px;max-height:88%;overflow-y:auto}
.toast{position:absolute;left:14px;right:14px;bottom:84px;background:var(--green);color:#fff;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-weight:800;font-size:13.5px;padding:10px 12px;z-index:7}
.over{position:absolute;inset:0;background:var(--cobalt);color:#fff;z-index:6;display:grid;place-items:center;text-align:center;padding:28px}
.over svg.key{width:120px;height:120px;margin:0 auto 18px;display:block}
.over h2{font-size:34px;letter-spacing:-1px;line-height:1}
.over p{font-size:15px;margin:10px 0 22px;font-weight:700}
.over .btn{background:#fff;color:var(--ink);border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.qr{width:132px;height:132px;border:2px solid var(--ink);background:#fff;padding:6px;margin:0 auto;display:block}
.link{font-size:11.5px;font-weight:700;color:var(--slate);text-decoration:underline;text-underline-offset:3px;width:auto;justify-self:start}
.globe,.row>svg.globe{width:84px;height:84px;flex:none}
.path{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:center;text-align:center}
.path b{display:block;border:2px solid var(--ink);background:#fff;font-size:10.5px;letter-spacing:.8px;padding:7px 2px}
.path b.on{background:var(--cobalt);color:#fff}
.path small{display:block;font-size:10.5px;color:var(--slate);font-weight:700;margin-top:4px;line-height:1.2}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);background:#fff}
.stats div{padding:6px 4px;text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--slate)}
.stats div+div{border-left:2px solid var(--ink)}
.stats b{display:block;font-size:17px;color:var(--ink);letter-spacing:0}
@media (max-width:860px){.about{display:none}.stage{padding:0}.phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}}
@media (min-width:861px){.help{display:none}.phone{height:min(844px,calc(100vh - 48px))}}
@media (prefers-reduced-motion:no-preference){
  .sheet>div{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}
  .over svg.key{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.2) rotate(-40deg);opacity:0}}
  .toast{animation:up .18s ease-out}
}
button:focus-visible,input:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
</style>
</head>
<body>
<div class="stage">
  <aside class="about">
    <div class="mast"><div id="globe"></div><div><h1>SPORTZANIA ID //</h1><div class="sub">THE RESIDENT PASSPORT</div></div></div>
    <p class="lead">Пилот цифрового паспорта ребёнка: лагерь как город, соцсеть без переписки. Пройдите путь за две минуты:</p>
    <ul class="todo" id="todo"></ul>
    <div class="foot"><span>SK KIDS CHALLENGE 2026<br>КОСТАРЕВ ФЁДОР, 11 ЛЕТ</span><span class="barcode" aria-hidden="true"></span></div>
  </aside>
  <div class="phone" id="phone">
    <div class="demo" id="roles" aria-label="Демо: смотреть как"></div>
    <header class="top" id="top"></header>
    <main id="view"></main>
    <nav class="tabs" id="tabs"></nav>
  </div>
</div>

function radar(max = 340) {
  const SK = skills(), c = 160, R = 70, pt = (i, r) => { const a = Math.PI * 2 / 5 * i - Math.PI / 2; return [(c + r * Math.cos(a)).toFixed(1), (104 + r * Math.sin(a)).toFixed(1)]; };
  let g = "";
  for (let l = 1; l <= 4; l++) g += `<polygon points="${SK.map((_, i) => pt(i, R / 4 * l).join(",")).join(" ")}" fill="none" stroke="#CBD5E1" stroke-width="1"/>`;
  SK.forEach((_, i) => { const [x, y] = pt(i, R); g += `<line x1="${c}" y1="104" x2="${x}" y2="${y}" stroke="#0A0F1D" stroke-width="1.2"/>`; });
  g += `<polygon points="${SK.map((s, i) => pt(i, R * s[1] / 100).join(",")).join(" ")}" fill="rgba(29,78,216,.22)" stroke="#1D4ED8" stroke-width="2.5"/>`;
  SK.forEach((s, i) => { const [x, y] = pt(i, R * s[1] / 100); g += `<circle cx="${x}" cy="${y}" r="3.6" fill="#1D4ED8" stroke="#fff" stroke-width="1.4"/>`; });
  SK.forEach((s, i) => { const [x, y] = pt(i, R + 15); const an = i === 0 ? "middle" : i < 3 ? "start" : "end", dx = i === 0 ? 0 : i < 3 ? -8 : 8; g += `<text x="${+x + dx}" y="${+y + (i === 0 ? 0 : i === 2 || i === 3 ? 9 : 3)}" text-anchor="${an}" font-size="10" font-weight="800">${s[0].toUpperCase()} ${s[1]}</text>`; });
  return `<svg viewBox="0 0 320 196" role="img" aria-label="Радар компетенций: ${SK.map((s) => s.join(" ")).join(", ")}" style="display:block;width:100%;max-width:${max}px;margin:0 auto">${g}</svg>`;
}
function qr() {
  const n = 21; let r = "", seed = 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const eye = (x, y) => (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let on = rnd() > .52;
    if (eye(x, y)) { const ex = x > 13 ? x - 14 : x, ey = y > 13 ? y - 14 : y; on = ex === 0 || ex === 6 || ey === 0 || ey === 6 || (ex > 1 && ex < 5 && ey > 1 && ey < 5); }
    if (on) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg class="qr" viewBox="0 0 21 21" shape-rendering="crispEdges" aria-label="Демонстрационный QR-код">${r}</svg>`;
}
function globe(color = "#1D4ED8") {
  const R = 44, c = 50, t = 22 * Math.PI / 180, sp = 18 * Math.PI / 180;
  const pr = (la, lo) => { const x = Math.cos(la) * Math.sin(lo + sp), y = Math.sin(la), z = Math.cos(la) * Math.cos(lo + sp); return [c + R * x, c - R * (y * Math.cos(t) - z * Math.sin(t)), y * Math.sin(t) + z * Math.cos(t)]; };
  let f = "", b = "";
  const curve = (fn) => { let p = fn(0); for (let i = 1; i <= 60; i++) { const q = fn(i / 60); const s = `M${p[0].toFixed(1)} ${p[1].toFixed(1)}L${q[0].toFixed(1)} ${q[1].toFixed(1)}`; if (p[2] + q[2] >= 0) f += s; else b += s; p = q; } };
  for (let k = 0; k < 6; k++) curve((u) => pr(-Math.PI + u * 2 * Math.PI, k * Math.PI / 6));
  [-60, -30, 0, 30, 60].forEach((d) => curve((u) => pr(d * Math.PI / 180, u * 2 * Math.PI)));
  return `<svg class="globe" viewBox="0 0 100 100" fill="none" stroke="${color}" stroke-linecap="round" aria-hidden="true"><path d="${b}" stroke-width=".7" opacity=".4"/><path d="${f}" stroke-width="1.2"/><circle cx="50" cy="50" r="${R}" stroke-width="1.6"/></svg>`;
}

      <p class="muted" style="font-size:12px">Написать сообщение здесь нельзя: переписки в паспорте нет.</p>`;
  } else if (sheet.t === "qr") {
    h = `<div class="h">Паспорт в кармане</div>${qr()}<p class="muted" style="text-align:center">QR-код и ссылка открывают только проекты и радар навыков. Контактов и номера комнаты там нет.</p><button class="btn" data-a="pub">Что увидит учитель</button>`;
  } else if (sheet.t === "pub") {
    h = `<div class="cap">Публичная страница · sportzania.id/fedya_tech</div><div class="h">Резидент SportZania 2027</div>${radar(280)}
      <div><div class="only">${ICON.proj}<span>Робот-сортировщик<small>тимлид · подтверждён наставником</small></span></div>
      ${S.film && !S.hide.film ? `<div class="only">${ICON.film}<span>Фильм отряда<small>монтажёр · подтверждён наставником</small></span></div>` : ""}</div>
      <p class="note">Имени, отряда, контактов и номера комнаты здесь нет. Ссылку можно закрыть в любой момент.</p>`;
  } else if (sheet.t === "mark") {
    h = sheet.step === 1 ? `<div class="cap">Отметка за 1 минуту · касание 2 из 3</div><div class="h">Какой навык проявил ${sheet.n}?</div><div class="chips">${BASE.map((s) => `<button class="chip" data-a="mark2" data-v="${s[0]}">${s[0]}</button>`).join("")}</div>`
      : `<div class="cap">Касание 3 из 3 · навык «${sheet.skill}»</div><div class="h">Что сказать?</div><div class="g" style="gap:8px">${PRAISE.map((t) => `<button class="chip" data-a="mark3" data-v="${t}">${t}</button>`).join("")}</div>`;
  } else if (sheet.t === "del") {
    h = `<div class="h">Удалить паспорт?</div><p class="muted">Профиль, проекты и друзья исчезнут навсегда. Удаление подтверждает родитель — это право семьи.</p><button class="btn" style="background:var(--red);border-color:var(--red)" data-a="reset">Удалить и начать заново</button>`;
  } else if (sheet.t === "help") {
    h = `<div class="h">Что попробовать</div><ul class="todo">${todo()}</ul><button class="btn ghost" data-a="reset">Начать демо заново</button>`;
  }
  return `<div class="sheet" data-a="close"><div data-stop="1" role="dialog" aria-modal="true">${h}<button class="btn ghost" data-a="close">Закрыть</button></div></div>`;
}
function todo() {
  return [["Стань жителем города: выбери три интереса", S.status !== "guest"], ["Найди своих фильтром «Общие вайбы»", S.tour.filter], ["Добавь цель и стань резидентом", S.status === "resident"],
    ["Подружись: Friend-Lock откроет контакт", S.tour.friend], ["Отметь настроение дня на вкладке «Вечер»", S.done], ["Вожатый: отметь прогресс в три касания", S.marks.length > 0],
    ["Родитель: открой данные, закрытые для всех", S.tour.parent], ["После смены: начни онлайн-курс", S.courseOn]]
    .map(([t, ok]) => `<li class="${ok ? "ok" : ""}"><i></i><span>${t}</span></li>`).join("");
}
function say(t) { toast = t; clearTimeout(tt); tt = setTimeout(() => { toast = null; draw(); }, 2800); }

function draw() {
  const ROLES = [["kid", "Резидент"], ["counselor", "Вожатый"], ["teacher", "Педагог"], ["parent", "Родитель"]];
  $("roles").innerHTML = ROLES.map(([r, t]) => `<button class="${S.role === r ? "on" : ""}" data-a="role" data-v="${r}" aria-pressed="${S.role === r}">${t}</button>`).join("");
  const where = {kid: S.season === "after" ? "после смены" : "идёт смена", counselor: "экран вожатого", teacher: "онлайн-школа", parent: "кабинет родителя"}[S.role];
  $("top").innerHTML = `<div class="brand">SPORTZANIA ID //</div><span class="where">${where}</span><div class="r">${S.role === "kid" && S.status !== "guest" ? `<span class="pill">${S.coins} Z</span>` : ""}<button class="help" data-a="help" aria-label="Что попробовать">?</button></div>`;
  const locked = S.status === "guest", inc = Object.keys(S.incoming).filter((id) => !S.friends[id]).length;
  $("tabs").style.display = S.role === "kid" ? "" : "none";
  $("tabs").innerHTML = [["passport", "Паспорт", ICON.id], ["city", "Город", ICON.city], ["projects", "Проекты", ICON.proj], ["evening", "Вечер", ICON.eve]]
    .map(([k, t, i]) => `<button class="${S.tab === k ? "on" : ""} ${locked && k !== "passport" ? "lock" : !locked && S.tab !== k && ((k === "city" && inc) || (k === "evening" && !S.done)) ? "dot" : ""}" data-a="tab" data-v="${k}" aria-current="${S.tab === k}">${i}${t}</button>`).join("");
  const v = {counselor: vCounselor, teacher: vTeacher, parent: vParent}[S.role] || {passport: vPassport, city: vCity, projects: vProjects, evening: vEvening}[S.tab];
  $("view").innerHTML = v();
  document.querySelectorAll(".sheet,.toast,.over").forEach((e) => e.remove());
  const ov = over === "key" ? `<div class="over" role="dialog" aria-modal="true"><div><svg class="key" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4.5"/><path d="M11.5 11.5 20 3M16 7l3 3M13.5 9.5l2.5 2.5"/></svg><h2>КЛЮЧ ПОЛУЧЕН</h2><p>Ты — житель города SportZania.<br>Теперь видно, кто живёт рядом.</p><button class="btn" data-a="enter">Войти в город</button></div></div>` : "";
  $("phone").insertAdjacentHTML("beforeend", ov + sheetHtml() + (toast ? `<div class="toast" role="status">${toast}</div>` : ""));
  const r = $("mood");
  if (r) r.oninput = () => { S.mood = +r.value; $("moodtxt").textContent = S.mood > 70 ? "Сегодня имба!" : S.mood > 35 ? "Нормальный вайб" : "Сегодня токсично"; save(); };
  $("todo").innerHTML = todo();
  save();
}
const top0 = () => { $("view").scrollTop = 0; };
const ACT = {
  role: (v) => { S.role = v; sheet = null; top0(); },
  tab: (v) => { S.tab = v; S.role = "kid"; sheet = null; top0(); },
  scan: () => { S.step = 1; say("Бейдж найден: Фёдор, отряд 2"); top0(); },
  like: (v) => { S.likes = S.likes.includes(v) ? S.likes.filter((x) => x !== v) : S.likes.concat(v); },
  key: () => { if (S.likes.length >= 3) { S.status = "citizen"; over = "key"; } },
  enter: () => { over = null; S.tab = "city"; top0(); },
  goal: (v) => { S.goal = v; S.status = "resident"; say("Уровень: Резидент 2027. Теперь можно дружить"); },
  filter: (v) => { S.filter = S.filter === v ? null : v; S.tour.filter = 1; },
  open: (v) => { sheet = {t: "person", id: v}; },
  request: (v) => { S.sent[v] = 1; say("Запрос отправлен: ждём ответа"); },
  confirm: (v) => { const p = who(v); S.friends[v] = 1; delete S.sent[v]; S.tour.friend = 1; say(p.name + (p.f ? " подтвердила" : " подтвердил") + " дружбу. Friend-Lock открыт"); },
  accept: (v) => { if (S.status !== "resident") { say("Сначала добавь цель на смену в паспорте"); return; } S.friends[v] = 1; delete S.incoming[v]; S.tour.friend = 1; say("Вы друзья: контакты открыты обоим"); },
  decline: (v) => { delete S.incoming[v]; },
  tog: (v) => { S[v] = !S[v]; },
  hide: (v) => { S.hide[v] = !S.hide[v]; },
  win: (v) => { S.win = S.win === v ? null : v; },
  checkin: () => { S.done = true; S.coins += 10; S.streak += 1; say("Чек-ин сохранён: +10 монет"); },
  lb: (v) => { S.lbTab = v; },
  qr: () => { sheet = {t: "qr"}; },
  pub: () => { sheet = {t: "pub"}; },
  help: () => { sheet = {t: "help"}; },
  team: () => { S.team = true; say("Команда «Роботы» собрана"); },
  confirmFilm: () => { S.film = true; say("Проект подтверждён: он уже в паспорте ребёнка"); },
  mark: (v) => { sheet = {t: "mark", step: 1, n: v}; },
  mark2: (v) => { sheet.step = 2; sheet.skill = v; },
  mark3: (v) => { S.marks.push({skill: sheet.skill, phrase: v}); say("Готово: +1 к навыку «" + sheet.skill + "» в паспорте"); sheet = null; },
  season: (v) => { S.season = v; say(v === "after" ? "Смена закончилась. Паспорт едет в онлайн-школу" : "Снова на смене"); top0(); },
  course: () => { S.courseOn = true; S.season = "after"; say("Курс начат: преподаватель уже видит навыки и проекты"); top0(); },
  lesson: () => { if (S.course < 3) { const l = LESSONS[S.course]; S.course += 1; say("Урок пройден: +2 к навыку «" + l[1] + "»"); } },
  reveal: (v) => { S.reveal = S.reveal === v ? null : v; S.tour.parent = 1; },
  del: () => { sheet = {t: "del"}; },
  reset: () => { S = JSON.parse(JSON.stringify(DEF)); sheet = null; over = null; top0(); },
  close: () => { sheet = null; }
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  if (el.dataset.a === "close" && el.classList.contains("sheet") && e.target.closest("[data-stop]")) return;
  ACT[el.dataset.a](el.dataset.v);
  draw();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheet) { sheet = null; draw(); } });
$("globe").innerHTML = globe();
draw();
</script>
</body>
</html>
